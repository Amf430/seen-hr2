<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختبارات المتصفح — المسير والحالة اليومية</title>
<style>
  body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;padding:20px;line-height:1.7;background:#faf7f5}
  h2{color:#240215;font-size:16px;margin:22px 0 6px;border-bottom:1px solid #e7ded7;padding-bottom:4px}
  .ok{color:#1a7f4b}.bad{color:#c0243a;font-weight:700}
  .row{font-size:14px}
  pre{background:#fff;border:1px solid #e7ded7;border-radius:8px;padding:10px;
      font-size:12px;overflow:auto;margin:4px 0 0 0}
  #sum{font-size:17px;font-weight:700;margin-top:24px;padding:12px;border-radius:8px}
  .pass{background:#e6f5ec;color:#1a7f4b}.fail{background:#fdeaed;color:#c0243a}
</style>
</head>
<body>
<h1 style="font-size:19px;color:#240215">اختبارات المتصفح</h1>
<p style="font-size:13px;color:#6f645d;margin:0 0 8px">
  payroll.js و attendance.js تجرّان firebase.js عبر سلسلة الاستيراد، وهي تجلب
  الـSDK من gstatic وقت الاستيراد — فلا تُستوردان في node. تُختبران هنا،
  على الوحدات الحقيقية نفسها التي تعمل في النظام.</p>
<div id="out"></div>
<div id="sum"></div>

<script type="module">
import { setSettings } from '../../js/lib/state.js';
import { cycleOf, ymd } from '../../js/lib/dates.js';
import { computePayroll, isUnpaidLeave, payrollConfig } from '../../js/lib/payroll.js';
import { buildDailyStatus, sessionsOf, workedSecs, lastOutOf, dayBounds } from '../../js/lib/attendance.js';
import { attendanceExport, payrollExport } from '../../js/lib/excel.js';
import { teamSummaryOf, teamExportRows } from '../../js/lib/team-stats.js';
import { dayWork } from '../../js/pages/attend.js';
import { compress } from '../../js/lib/photo.js';
import { permWindowOpen, permOldestDate } from '../../js/lib/requests.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const results = [];
const group = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
function eq(name, expected, actual) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? pass++ : fail++;
  results.push({ name, ok, expected: e, actual: a });
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'bad');
  d.textContent = (ok ? '✓ ' : '✗ ') + name;
  if (!ok) { const p = document.createElement('pre');
    p.textContent = 'توقّعنا: ' + e + '\nوجاء:   ' + a; d.appendChild(p); }
  out.appendChild(d);
}

/* ورديات الشركة: الأحد–الخميس ٠٨:٠٠–١٦:٠٠ */
const WEEK = {
  0:{type:'morning',start:'08:00',end:'16:00'}, 1:{type:'morning',start:'08:00',end:'16:00'},
  2:{type:'morning',start:'08:00',end:'16:00'}, 3:{type:'morning',start:'08:00',end:'16:00'},
  4:{type:'morning',start:'08:00',end:'16:00'},
  5:{type:'off',start:'',end:''}, 6:{type:'off',start:'',end:''}
};
const LT_ANNUAL = 'lt-annual', LT_UNPAID = 'lt-unpaid';
const settings = (over={}) => setSettings({
  shifts: WEEK, departments: [], dateExceptions: [], branches: [], approvers: [],
  leaveTypes: [
    { id: LT_ANNUAL, label:'إجازة سنوية', balance:21, deduct:true },
    { id: LT_UNPAID, label:'إجازة بدون راتب', balance:30, deduct:true, unpaid:true }
  ],
  company: { lat:null, lng:null, radius:500 },
  payroll: { hoursPerDay:8, daysPerMonth:30, graceMinutes:0 },
  ...over
});

/* ── دورة منتهية بالكامل حتى لا يتدخّل «اليوم» في النتيجة ──
   ⚠️ computePayroll تقصّ عند min(نهاية الدورة, الآن). دورة ماضية تجعل
   المجموعة ثابتة مهما تغيّر تاريخ التشغيل. */
const CYC = cycleOf('2026-06-10');            /* 2026-05-26 → 2026-06-25 */
const at = (dateStr, hhmm) => new Date(dateStr + 'T' + hhmm + ':00');

/* موظف واحد براتب ٩٠٠٠ — قيمة اليوم ٣٠٠، قيمة الساعة ٣٧٫٥ */
const EMP = { id:'e1', name:'سالم', role:'employee', department:'المبيعات',
              salary:9000, hireDate:'2020-01-01' };

/* سجل بصمة ليوم واحد */
const rec = (dateStr, inHm, outHm) => ({
  employeeUid:'e1', date:dateStr,
  sessions:[{ in: at(dateStr,inHm), out: outHm ? at(dateStr,outHm) : null }]
});

/* كل أيام الدورة حاضرة في الوقت، ثم نغيّر يوماً واحداً في كل اختبار */
function fullMonth(overrides = {}) {
  const recs = [];
  for (let d = new Date(CYC.start); d <= CYC.end; d.setDate(d.getDate()+1)) {
    const ds = ymd(d), dow = d.getDay();
    if (dow === 5 || dow === 6) continue;             /* راحة */
    if (ds in overrides) { const o = overrides[ds]; if (o) recs.push(o); continue; }
    recs.push(rec(ds, '08:00', '16:00'));
  }
  return recs;
}
const runPayroll = (recs, reqs=[]) => computePayroll(CYC, [EMP], reqs, recs)[0];

/* ══════════════════ ١. المسير — الأساس ══════════════════ */
group('١. المسير — الحضور المثالي');
settings();
{
  const r = runPayroll(fullMonth());
  eq('قيمة اليوم = الراتب ÷ ٣٠', 300, r.dayRate);
  eq('قيمة الساعة = قيمة اليوم ÷ ٨', 37.5, r.hourRate);
  eq('حضور كامل ⇒ لا خصم', 0, r.total);
  eq('وصافي الراتب كامل', 9000, r.net);
  eq('ولا أيام غياب', 0, r.absentDays);
  eq('ولا أيام تأخير', 0, r.lateDays);
  /* دورة ٢٦ مايو ← ٢٥ يونيو ٢٠٢٦ = ٣١ يوماً، منها ٨ جمعة/سبت ⇒ ٢٣ يوم عمل */
  eq('أيام الراحة غير محسوبة — ٢٣ يوم عمل', 23, r.workDays);
}

/* ══════════════════ ٢. التأخير والخروج المبكر ══════════════════ */
group('٢. التأخير والخروج المبكر');
{
  /* ٢٠٢٦-٠٦-٠١ اثنين: دخل ٠٨:٣٠ ⇒ ٣٠ د تأخير */
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:30','16:00') }));
  eq('٣٠ دقيقة تأخير تُسجَّل', 30, r.lateMin);
  eq('ويوم تأخير واحد', 1, r.lateDays);
  eq('والخصم = ٣٠د × ٣٧٫٥ ÷ ٦٠ = ١٨٫٧٥', 18.75, +r.total.toFixed(2));
}
{
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:00','15:00') }));
  eq('خروج مبكر ٦٠ دقيقة يُسجَّل', 60, r.earlyMin);
  eq('وخصمه = ساعة كاملة = ٣٧٫٥', 37.5, +r.total.toFixed(2));
}
{
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:20','15:40') }));
  eq('التأخير والخروج المبكر يجتمعان', { late:20, early:20 }, { late:r.lateMin, early:r.earlyMin });
  eq('ويُخصمان معاً = ٤٠د = ٢٥', 25, +r.total.toFixed(2));
}

/* ══════════════════ ٣. فترات الاستئذان المعتمدة ══════════════════ */
group('٣. فترات الاستئذان — Late / Early / Mid-shift');
const DAY = '2026-06-01';
const permOn = (date, category, startTime, endTime, status='approved', over={}) => ({
  id:`p-${date}-${category}-${startTime}`, type:'permission', status, employeeUid:'e1', date,
  category, categoryLabel:category, startTime, endTime, ...over
});
const legacyPerm = (date, category, time, status='approved') => ({
  id:`legacy-${date}-${category}`, type:'permission', status, employeeUid:'e1', date,
  category, categoryLabel:category, time
});
const multiRec = (date, pairs) => ({ employeeUid:'e1', date, sessions:pairs.map(([i,o]) => ({
  in:at(date,i), out:o ? at(date,o) : null
})) });
const dayOf = (record, permissions=[]) => buildDailyStatus(CYC, [EMP], permissions,
  fullMonth({ [DAY]:record })).find((r) => r.dateStr === DAY);

const lateRec = rec(DAY, '08:30', '16:00');
const lateFull = permOn(DAY, 'تأخير عن الدوام', '08:00', '08:30');
const latePart = permOn(DAY, 'تأخير عن الدوام', '08:00', '08:15');
eq('Late كامل: لا نقص وساعات اليوم ثمانٍ', { late:0, exempt:30, hours:8, ded:0 },
   (() => { const r=runPayroll(fullMonth({[DAY]:lateRec}), [lateFull]); return {
     late:r.lateMin, exempt:r.exemptMin, hours:r.details.find(d=>d.dateStr===DAY).effectiveSecs/3600,
     ded:+r.dedHours.toFixed(2) }; })());
eq('Late جزئي: يغطي ١٥ دقيقة فقط', { late:15, exempt:15, hours:7.75, ded:9.38 },
   (() => { const r=runPayroll(fullMonth({[DAY]:lateRec}), [latePart]); return {
     late:r.lateMin, exempt:r.exemptMin, hours:r.details.find(d=>d.dateStr===DAY).effectiveSecs/3600,
     ded:+r.dedHours.toFixed(2) }; })());

const earlyRec = rec(DAY, '08:00', '15:00');
const earlyFull = permOn(DAY, 'خروج مبكر', '15:00', '16:00');
const earlyPart = permOn(DAY, 'خروج مبكر', '15:30', '16:00');
const earlyDay = dayOf(earlyRec, [earlyFull]);
const earlyPay = runPayroll(fullMonth({[DAY]:earlyRec}), [earlyFull]);
const earlyDetail = earlyPay.details.find((d) => d.dateStr === DAY);
eq('Early كامل: لا نقص وساعات اليوم ثمانٍ', { early:0, exempt:60, hours:8, ded:0 }, {
  early:earlyPay.earlyMin, exempt:earlyPay.exemptMin, hours:earlyDay.secs/3600, ded:earlyPay.dedHours
});
eq('Early جزئي: الجزء ١٥:٠٠–١٥:٣٠ يبقى نقصاً', { early:30, exempt:30, hours:7.5, ded:18.75 },
   (() => { const r=runPayroll(fullMonth({[DAY]:earlyRec}), [earlyPart]); return {
     early:r.earlyMin, exempt:r.exemptMin, hours:r.details.find(d=>d.dateStr===DAY).effectiveSecs/3600,
     ded:+r.dedHours.toFixed(2) }; })());
eq('الخروج الفعلي يبقى محفوظاً منفصلاً', { actual:'15:00', effective:'16:00', actualHours:7 }, {
  actual:earlyDay.lastOut.toTimeString().slice(0,5), effective:earlyDay.effectiveOut.toTimeString().slice(0,5),
  actualHours:earlyDay.actualSecs/3600
});
eq('ملاحظة Early تعرض الخروج الفعلي ونهاية الوردية', true,
   /خروج فعلي 15:00.*استئذان خروج مبكر معتمد حتى نهاية الوردية 16:00/.test(earlyDay.note));

const split = multiRec(DAY, [['08:00','12:00'], ['13:00','16:00']]);
const midFull = permOn(DAY, 'استئذان أثناء الدوام', '12:00', '13:00');
const midPart = permOn(DAY, 'استئذان أثناء الدوام', '12:00', '12:30');
const midDay = dayOf(split, [midFull]);
const midPay = runPayroll(fullMonth({[DAY]:split}), [midFull]);
eq('Mid كامل: اتحاد الجلسات والفترة يعطي ٨ ساعات', { actual:7, effective:8, gap:0, exempt:60 }, {
  actual:midDay.actualSecs/3600, effective:midDay.secs/3600, gap:midPay.gapMin, exempt:midPay.exemptMin
});
eq('صفحة سجلّي تطبق Mid المعتمد على ساعات الجوال', 8,
   dayWork(split,EMP.department,EMP,[midFull]).secs/3600);
eq('صفحة سجلّي تحفظ تعريفها القديم بلا Mid معتمد', 7,
   dayWork(split,EMP.department,EMP,[]).secs/3600);
const midPartialPay = runPayroll(fullMonth({[DAY]:split}), [midPart]);
eq('Mid جزئي: نصف ساعة خارج الاستئذان تبقى نقصاً',
   { actual:7, effective:7.5, gap:30, exempt:30, ded:18.75 },
   (() => { const d=midPartialPay.details.find(x=>x.dateStr===DAY); return {
     actual:d.actualSecs/3600, effective:d.effectiveSecs/3600, gap:midPartialPay.gapMin,
     exempt:midPartialPay.exemptMin, ded:+midPartialPay.dedHours.toFixed(2) }; })());

const overlaps = [midPart, permOn(DAY, 'استئذان أثناء الدوام', '12:20', '13:00')];
eq('أكثر من Permission متداخل لا يضاعف التعويض', { credited:60, effective:8, intervals:'12:00–13:00' },
   (() => { const d=dayOf(split, overlaps); return { credited:d.creditedSecs/60, effective:d.secs/3600,
     intervals:d.permissionIntervalsLabel }; })());
const overlapWork = multiRec(DAY, [['08:00','12:30'], ['13:00','16:00']]);
eq('الجزء المتداخل مع وقت عمل فعلي لا يُعوّض مرتين', { actual:7.5, credited:0.5, effective:8 },
   (() => { const d=dayOf(overlapWork, [midFull]); return {
     actual:d.actualSecs/3600, credited:d.creditedSecs/3600, effective:d.secs/3600 }; })());

eq('Legacy Late ما زال يغطي بداية الوردية إلى time', { late:0, hours:8 },
   (() => { const r=runPayroll(fullMonth({[DAY]:lateRec}), [legacyPerm(DAY,'تأخير عن الدوام','08:30')]);
     return { late:r.lateMin, hours:r.details.find(d=>d.dateStr===DAY).effectiveSecs/3600 }; })());
eq('Legacy Early ما زال يغطي time إلى نهاية الوردية', { early:0, hours:8 },
   (() => { const r=runPayroll(fullMonth({[DAY]:earlyRec}), [legacyPerm(DAY,'خروج مبكر','15:00')]);
     return { early:r.earlyMin, hours:r.details.find(d=>d.dateStr===DAY).effectiveSecs/3600 }; })());

/* الحارس الأهم للنطاق: الجلسات المتعددة لا تغيّر تعريف اليوم من نفسها. */
eq('بلا Mid Approved يبقى span القديم ولا تُنشأ فجوة جديدة', { hours:8, gap:0 },
   (() => { const r=runPayroll(fullMonth({[DAY]:split})); const d=r.details.find(x=>x.dateStr===DAY);
     return { hours:d.effectiveSecs/3600, gap:r.gapMin }; })());
eq('Pending Mid لا يفعّل حساب الجلسات ولا يعوّض', { hours:8, gap:0, credited:0 },
   (() => { const d=dayOf(split, [permOn(DAY,'استئذان أثناء الدوام','12:00','13:00','pending')]);
     return { hours:d.secs/3600, gap:d.midGapMin, credited:d.creditedSecs }; })());
eq('Rejected Early صفر تأثير', 7,
   dayOf(earlyRec, [permOn(DAY,'خروج مبكر','15:00','16:00','rejected')]).secs/3600);
eq('Permission ليوم مختلف صفر تأثير', 7,
   dayOf(earlyRec, [permOn('2026-06-02','خروج مبكر','15:00','16:00')]).secs/3600);

const lateAndEarlyDay = dayOf(rec(DAY,'08:30','15:00'), [earlyFull]);
eq('استئذان Early لا يمحو مخالفة Late غير المغطاة', { cls:'late', lateMin:30, onTime:0 },
   (() => { const t=teamSummaryOf([lateAndEarlyDay]).employees[0]; return {
     cls:lateAndEarlyDay.cls, lateMin:lateAndEarlyDay.lateMin, onTime:t.onTime }; })());
eq('Late Approved يصحح Commitment المغطى فقط', { cls:'present', onTime:100, overall:100 },
   (() => { const d=dayOf(lateRec,[lateFull]); const t=teamSummaryOf([d]).employees[0];
     return { cls:d.cls, onTime:t.onTime, overall:t.overall }; })());
eq('Early وMid Approved لا يسببان عقوبة Commitment', { early:100, mid:100 }, {
  early:teamSummaryOf([earlyDay]).employees[0].overall,
  mid:teamSummaryOf([midDay]).employees[0].overall
});
eq('مؤشر ساعات أداء القسم وتصديره يستعملان الساعات المحتسبة', { metric:8, excel:8 },
   (() => { const t=teamSummaryOf([midDay]); return { metric:t.employees[0].secs/3600,
     excel:teamExportRows(t)[0]['ساعات العمل'] }; })());

const openSplit = multiRec(DAY, [['08:00','12:00'], ['13:00',null]]);
const openDay = dayOf(openSplit, [midFull]);
eq('Open punches: fallback بلا تعويض تخميني', { fallback:true, credited:0, bound:'13:00', hours:5 }, {
  fallback:openDay.permissionFallback, credited:openDay.creditedSecs,
  bound:openDay.lastOut.toTimeString().slice(0,5), hours:openDay.secs/3600
});
const ambiguous = { employeeUid:'e1', date:DAY, sessions:[
  { in:at(DAY,'08:00'), out:at(DAY,'13:00') }, { in:at(DAY,'12:00'), out:at(DAY,'16:00') }
] };
eq('Overlapping punches: fallback إلى span القديم بلا Mid credit', { hours:8, fallback:true, credited:0 },
   (() => { const d=dayOf(ambiguous,[midFull]); return {
     hours:d.secs/3600, fallback:d.permissionFallback, credited:d.creditedSecs }; })());

/* الاثنين وردية ليلية ٢٢:٠٠–٠٦:٠٠، ونهاية الاستئذان في اليوم التالي. */
settings({ shifts:{ ...WEEK, 1:{type:'evening',start:'22:00',end:'06:00'} } });
const nightRec = { employeeUid:'e1', date:DAY,
  sessions:[{ in:at(DAY,'22:00'), out:at('2026-06-02','03:30') }] };
const nightPerm = permOn(DAY,'خروج مبكر','03:30','06:00');
const nightDay = buildDailyStatus(CYC,[EMP],[nightPerm],[nightRec]).find(r=>r.dateStr===DAY);
eq('Overnight: النهاية المحتسبة هي ٠٦:٠٠ في اليوم التالي', '2026-06-02T06:00',
   `${ymd(nightDay.effectiveOut)}T${nightDay.effectiveOut.toTimeString().slice(0,5)}`);
eq('Overnight: ساعات اليوم المحتسبة ثمانٍ', 8, nightDay.secs/3600);
settings();

/* Excel: نحجز المصنف في الذاكرة حتى نفحص الأعمدة نفسها من دون تنزيل ملف. */
const savedBooks = [];
window.XLSX = {
  utils:{ book_new:()=>({sheets:{}}), json_to_sheet:(rows)=>rows,
    book_append_sheet:(book,sheet,name)=>{ book.sheets[name]=sheet; } },
  writeFile:(book,filename)=>savedBooks.push({book,filename})
};
attendanceExport(CYC,{isDevice:true},[earlyDay],[{r:earlyRec,idx:0,s:earlyRec.sessions[0]}]);
const attBook=savedBooks.pop().book.sheets;
eq('Excel الحضور يبقي الخروج الفعلي ويعرض المحتسب', { actual:'15:00', effective:'16:00' }, {
  actual:attBook['التقرير اليومي'][0]['خروج'], effective:attBook['التقرير اليومي'][0]['خروج محتسب']
});
eq('Excel الحضور يفصل الساعات الفعلية والمحتسبة والفترة',
   { actual:'7.00', effective:'8.00', interval:'15:00–16:00', credit:60 },
   (() => { const x=attBook['التقرير اليومي'][0]; return { actual:x['ساعات فعلية'],
     effective:x['ساعات العمل'], interval:x['فترات استئذان محتسبة'], credit:x['دقائق استئذان محتسبة'] }; })());
eq('الجلسة الخام في Excel تبقى سبع ساعات', '7.00', attBook['الجلسات التفصيلية'][0]['ساعات العمل']);
payrollExport(CYC,[midPartialPay]);
const payBook=savedBooks.pop().book.sheets;
eq('Excel المسير يفصل الفعلي والمحتسب ونقص Mid', { actual:183, effective:183.5, gap:30 },
   (() => { const x=payBook['مسير الرواتب'][0]; return { actual:x['ساعات فعلية'],
     effective:x['ساعات محتسبة بعد الاستئذانات'], gap:x['دقائق نقص أثناء الوردية'] }; })());
const excelDay=payBook['تفصيل الأيام'].find(d=>d['التاريخ']===DAY);
eq('تفصيل Excel يحمل الفترة والائتمان والنقص', { interval:'12:00–12:30', credit:30, gap:30 }, {
  interval:excelDay['فترات استئذان محتسبة'], credit:excelDay['دقائق استئذان محتسبة'],
  gap:excelDay['دقائق نقص أثناء الوردية']
});

/* ══════════════════ ٤. الغياب والإجازات ══════════════════ */
group('٤. الغياب والإجازات');
{
  const r = runPayroll(fullMonth({ '2026-06-01': null }));
  eq('يوم بلا بصمة = غياب', 1, r.absentDays);
  eq('وخصمه يوم كامل = ٣٠٠', 300, +r.total.toFixed(2));
}
{
  const leave = { id:'L1', type:'leave', status:'approved', employeeUid:'e1',
                  startDate:'2026-06-01', endDate:'2026-06-03', days:3,
                  leaveTypeId:LT_ANNUAL, categoryLabel:'إجازة سنوية', deduct:true };
  const r = runPayroll(fullMonth({ '2026-06-01':null, '2026-06-02':null, '2026-06-03':null }), [leave]);
  eq('إجازة مدفوعة معتمدة ⇒ ليست غياباً', 0, r.absentDays);
  eq('وتُحتسب ٣ أيام إجازة مدفوعة', 3, r.paidLeaveDays);
  eq('وبلا أي خصم', 0, +r.total.toFixed(2));
}
{
  const unpaid = { id:'L2', type:'leave', status:'approved', employeeUid:'e1',
                   startDate:'2026-06-01', endDate:'2026-06-02', days:2,
                   leaveTypeId:LT_UNPAID, categoryLabel:'إجازة بدون راتب', deduct:true };

/* بصمات خام كما يكتبها الجسر: التناوب يقفل جلسة ويفتح التي بعدها.
   punches('09:50','10:47','18:00') = الحالة الواقعية — بصم، ثم نسي أنه بصم
   فجرّب ثانية، ثم بصم انصرافه. الثالثة صارت «دخولاً» مفتوحاً. */
function punches(dateStr, ...hms) {
  const sessions = [];
  hms.forEach((hm) => {
    const open = sessions.length && !sessions[sessions.length - 1].out;
    if (open) sessions[sessions.length - 1].out = at(dateStr, hm);
    else      sessions.push({ in: at(dateStr, hm), out: null });
  });
  return { employeeUid: 'e1', date: dateStr, sessions };
}

/* ⚠️ onload لا img.decode(): decode() على صورة خارج المستند قد لا تُحسم
   أبداً في كروم، فتتعلّق المجموعة بلا خطأ ولا نتيجة. */
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = () => rej(new Error('img-load-failed'));
  i.src = src;
});
async function imgFile(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#3a1020'); g.addColorStop(1,'#e8d8c0');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  c.fillStyle = '#fff'; c.font = Math.round(h/8)+'px sans-serif';
  c.fillText('LOC', w/6, h/2);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.95));
  return new File([blob], 'shot.jpg', { type:'image/jpeg' });
}
{
  const dataUrl = await compress(await imgFile(4000, 3000));
  eq('الصورة تُضغط إلى JPEG', true, dataUrl.startsWith('data:image/jpeg'));
  eq('وتبقى دون حدّ القاعدة (٢٤٠ ألف حرف)', true, dataUrl.length < 240000);
  const img = await loadImg(dataUrl);

  eq('ونسبتها محفوظة (٤:٣ ⇒ ٤٨٠)', 480, img.height);
}
