<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختبارات المتصفح — المسير والحالة اليومية</title>
<style>
  body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;padding:20px;line-height:1.7;background:#faf7f5}
  h2{color:#240215;font-size:16px;margin:22px 0 6px;border-bottom:1px solid #e7ded7;padding-bottom:4px}
  .ok{color:#1a7f4b}.bad{color:#c0243a;font-weight:700}
  .row{font-size:14px}
  pre{background:#fff;border:1px solid #e7ded7;border-radius:8px;padding:10px;
      font-size:12px;overflow:auto;margin:4px 0 0 0}
  #sum{font-size:17px;font-weight:700;margin-top:24px;padding:12px;border-radius:8px}
  .pass{background:#e6f5ec;color:#1a7f4b}.fail{background:#fdeaed;color:#c0243a}
</style>
</head>
<body>
<h1 style="font-size:19px;color:#240215">اختبارات المتصفح</h1>
<p style="font-size:13px;color:#6f645d;margin:0 0 8px">
  payroll.js و attendance.js تجرّان firebase.js عبر سلسلة الاستيراد، وهي تجلب
  الـSDK من gstatic وقت الاستيراد — فلا تُستوردان في node. تُختبران هنا،
  على الوحدات الحقيقية نفسها التي تعمل في النظام.</p>
<div id="out"></div>
<div id="sum"></div>

<script type="module">
import { setSettings } from '../../js/lib/state.js';
import { cycleOf, ymd } from '../../js/lib/dates.js';
import { computePayroll, isUnpaidLeave, payrollConfig } from '../../js/lib/payroll.js';
import { buildDailyStatus, sessionsOf, workedSecs, lastOutOf, dayBounds } from '../../js/lib/attendance.js';
import { attendanceExport, payrollExport, teamPerfExport } from '../../js/lib/excel.js';
import { teamSummaryOf, teamExportRows } from '../../js/lib/team-stats.js';
import { payrollTotals } from '../../js/lib/payroll-view.js';
import { dayWork } from '../../js/pages/attend.js';
import { compress } from '../../js/lib/photo.js';
import { permWindowOpen, permOldestDate } from '../../js/lib/requests.js';
import { mergeAttendanceSources, selectPayrollAttendance } from '../../js/lib/attendance-sources.js';
import { attendanceMetrics } from '../../js/lib/attendance-metrics.js';
import { applyAll, adjustedUnifiedAttendance, adjustedPayrollAttendance } from '../../js/lib/adjustments.js';
import { todayAttendance, payrollSummary } from '../../js/lib/hr-stats.js';
import { attendancePresentation } from '../../js/lib/attendance-presentation.js';
import { clearApprovedRosterEntries, setApprovedRosterEntries } from '../../js/lib/weekly-roster.js';
import { rosterTimeRangeHtml, rosterTimeRangeText } from '../../js/pages/weekly-roster.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const results = [];
const group = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
function eq(name, expected, actual) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? pass++ : fail++;
  results.push({ name, ok, expected: e, actual: a });
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'bad');
  d.textContent = (ok ? '✓ ' : '✗ ') + name;
  if (!ok) { const p = document.createElement('pre');
    p.textContent = 'توقّعنا: ' + e + '\nوجاء:   ' + a; d.appendChild(p); }
  out.appendChild(d);
}

/* ورديات الشركة: الأحد–الخميس ٠٨:٠٠–١٦:٠٠ */
const WEEK = {
  0:{type:'morning',start:'08:00',end:'16:00'}, 1:{type:'morning',start:'08:00',end:'16:00'},
  2:{type:'morning',start:'08:00',end:'16:00'}, 3:{type:'morning',start:'08:00',end:'16:00'},
  4:{type:'morning',start:'08:00',end:'16:00'},
  5:{type:'off',start:'',end:''}, 6:{type:'off',start:'',end:''}
};
const LT_ANNUAL = 'lt-annual', LT_UNPAID = 'lt-unpaid';
const settings = (over={}) => setSettings({
  shifts: WEEK, departments: [], dateExceptions: [], branches: [], approvers: [],
  leaveTypes: [
    { id: LT_ANNUAL, label:'إجازة سنوية', balance:21, deduct:true },
    { id: LT_UNPAID, label:'إجازة بدون راتب', balance:30, deduct:true, unpaid:true }
  ],
  company: { lat:null, lng:null, radius:500 },
  payroll: { hoursPerDay:8, daysPerMonth:30, graceMinutes:0 },
  ...over
});

/* ── دورة منتهية بالكامل حتى لا يتدخّل «اليوم» في النتيجة ──
   ⚠️ computePayroll تقصّ عند min(نهاية الدورة, الآن). دورة ماضية تجعل
   المجموعة ثابتة مهما تغيّر تاريخ التشغيل. */
const CYC = cycleOf('2026-06-10');            /* 2026-05-26 → 2026-06-25 */
const at = (dateStr, hhmm) => new Date(dateStr + 'T' + hhmm + ':00');

/* موظف واحد براتب ٩٠٠٠ — قيمة اليوم ٣٠٠، قيمة الساعة ٣٧٫٥ */
const EMP = { id:'e1', name:'سالم', role:'employee', department:'المبيعات',
              salary:9000, hireDate:'2020-01-01' };
const RESTORED_EMP = { ...EMP, id:'e-new', previousUids:['e1','e-old-2'] };

/* سجل بصمة ليوم واحد */
const rec = (dateStr, inHm, outHm) => ({
  employeeUid:'e1', date:dateStr,
  sessions:[{ in: at(dateStr,inHm), out: outHm ? at(dateStr,outHm) : null }]
});

/* كل أيام الدورة حاضرة في الوقت، ثم نغيّر يوماً واحداً في كل اختبار */
function fullMonth(overrides = {}) {
  const recs = [];
  for (let d = new Date(CYC.start); d <= CYC.end; d.setDate(d.getDate()+1)) {
    const ds = ymd(d), dow = d.getDay();
    if (dow === 5 || dow === 6) continue;             /* راحة */
    if (ds in overrides) { const o = overrides[ds]; if (o) recs.push(o); continue; }
    recs.push(rec(ds, '08:00', '16:00'));
  }
  return recs;
}
const runPayroll = (recs, reqs=[]) => computePayroll(CYC, [EMP], reqs, recs)[0];

/* الهوية المستعادة تقرأ الطلب والسجل التاريخيين بلا تعديل أي وثيقة. */
settings();
{
  const oldPerm = { id:'old-perm', type:'permission', status:'approved',
    employeeUid:'e-old-2', date:'2026-06-01', category:'تأخير عن الدوام' };
  const oldLeave = { id:'old-leave', type:'leave', status:'approved',
    employeeUid:'e1', startDate:'2026-06-02', endDate:'2026-06-02',
    leaveTypeId:LT_ANNUAL, categoryLabel:'إجازة سنوية', deduct:true };
  const rows = buildDailyStatus(CYC, [RESTORED_EMP], [oldPerm, oldLeave], fullMonth({
    '2026-06-01': { ...rec('2026-06-01','08:30','16:00'), employeeUid:'e-old-2' },
    '2026-06-02': null
  }));
  eq('previousUid يربط الاستئذان بالسجل التاريخي', 'old-perm',
    rows.find((r) => r.dateStr === '2026-06-01').permissions[0].id);
  eq('previousUid يربط الإجازة بالهوية الحالية', 'leave',
    rows.find((r) => r.dateStr === '2026-06-02').cls);
  const foreign = computePayroll(CYC, [RESTORED_EMP], [{ ...oldLeave, employeeUid:'foreign-old' }],
    fullMonth({ '2026-06-02': null }))[0];
  eq('UID تاريخي لموظف آخر لا يمنح إجازة', 1, foreign.absentDays);
}

/* سجل موحد لا يضاعف اليوم، ويغذي المحرك المركزي بحدّين من مصدرين مختلفين. */
{
  const merged = mergeAttendanceSources([EMP], [
    { coll:'zkAttendance', records:[{ employeeUid:'e1', date:'2026-06-01', sessions:[{ in:at('2026-06-01','07:55'), out:at('2026-06-01','15:50') }] }] },
    { coll:'attendance', records:[{ employeeUid:'e1', date:'2026-06-01', sessions:[{ in:at('2026-06-01','08:20'), out:at('2026-06-01','16:10') }] }] }
  ]);
  eq('دمج المصدرين ينتج وثيقة يوم واحدة', 1, merged.length);
  const mergedRows = buildDailyStatus(CYC, [EMP], [], fullMonth({ '2026-06-01': merged[0] }));
  const day = mergedRows.find((r) => r.dateStr === '2026-06-01');
  eq('الحالة الموحدة تستعمل الدخول الأبكر', '07:55', day.firstIn.toTimeString().slice(0,5));
  eq('وتستعمل الخروج الأحدث بلا جمع ساعات المصدرين', 8.25, +(day.secs / 3600).toFixed(2));
}

/* تكامل Widget «داخل العمل الآن» مع السجل الموحد. */
{
  const today = ymd(new Date());
  const allDays = Object.fromEntries(Array.from({ length: 7 }, (_, dow) =>
    [dow, { type:'morning', start:'08:00', end:'16:00' }]));
  settings({ shifts: allDays });
  const physical = { employeeUid:'e1', date:today,
    sessions:[{ in:at(today,'08:00'), out:null }] };
  const mobile = { employeeUid:'e1', date:today,
    sessions:[{ in:at(today,'08:05'), out:null }] };
  const both = mergeAttendanceSources([EMP], [
    { coll:'zkAttendance', records:[physical] },
    { coll:'attendance', records:[mobile] }
  ]);
  const live = todayAttendance([EMP], both, []);
  eq('Widget يعرض المصدرين مرة واحدة', [1,1,'both','بصمة + جوال'],
     [live.inNow, live.insideNow.length, live.insideNow[0].sourceKind,
      live.insideNow[0].sourceLabel]);

  const completed = mergeAttendanceSources([EMP], [{ coll:'zkAttendance', records:[{
    ...physical, sessions:[{ in:at(today,'08:00'), out:at(today,'16:00') }]
  }] }]);
  eq('Widget لا يعرض من أكمل Check-out', 0,
     todayAttendance([EMP], completed, []).insideNow.length);
  settings();
}

/* ══════════════════ ١. المسير — الأساس ══════════════════ */
group('١. المسير — الحضور المثالي');
settings();
{
  const r = runPayroll(fullMonth());
  eq('قيمة اليوم = الراتب ÷ ٣٠', 300, r.dayRate);
  eq('قيمة الساعة = قيمة اليوم ÷ ٨', 37.5, r.hourRate);
  eq('حضور كامل ⇒ لا خصم', 0, r.total);
  eq('وصافي الراتب كامل', 9000, r.net);
  eq('ولا أيام غياب', 0, r.absentDays);
  eq('ولا أيام تأخير', 0, r.lateDays);
  /* دورة ٢٦ مايو ← ٢٥ يونيو ٢٠٢٦ = ٣١ يوماً، منها ٨ جمعة/سبت ⇒ ٢٣ يوم عمل */
  eq('أيام الراحة غير محسوبة — ٢٣ يوم عمل', 23, r.workDays);
}

/* ══════════════════ ٢. التأخير والخروج المبكر ══════════════════ */
group('٢. التأخير والخروج المبكر');
{
  /* ٢٠٢٦-٠٦-٠١ اثنين: دخل ٠٨:٣٠ ⇒ ٣٠ د تأخير */
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:30','16:00') }));
  eq('٣٠ دقيقة تأخير تُسجَّل', 30, r.lateMin);
  eq('ويوم تأخير واحد', 1, r.lateDays);
  eq('والخصم = ٣٠د × ٣٧٫٥ ÷ ٦٠ = ١٨٫٧٥', 18.75, +r.total.toFixed(2));
}
{
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:00','15:00') }));
  eq('خروج مبكر ٦٠ دقيقة يُسجَّل', 60, r.earlyMin);
  eq('وخصمه = ساعة كاملة = ٣٧٫٥', 37.5, +r.total.toFixed(2));
}
{
  const r = runPayroll(fullMonth({ '2026-06-01': rec('2026-06-01','08:20','15:40') }));
  eq('التأخير والخروج المبكر يجتمعان', { late:20, early:20 }, { late:r.lateMin, early:r.earlyMin });
  eq('ويُخصمان معاً = ٤٠د = ٢٥', 25, +r.total.toFixed(2));
}

/* ══════════════════ ٣. الاستئذان المعتمد يُعفي ══════════════════ */
group('٣. الاستئذان — المعتمد وحده يُعفي');
const permOn = (date, cat, status='approved', over={}) => ({
  id:'p-'+date+cat, type:'permission', status, employeeUid:'e1', date,
  category:cat, categoryLabel:cat, time:'09:00', reasonLabel:'مهمة عمل',
  note:'زيارة عميل', ...over
});
{
  const late = { '2026-06-01': rec('2026-06-01','08:30','16:00') };
  eq('بلا استئذان ⇒ ٣٠د تُخصم',
     { lateMin:30, exempt:0, ded:18.75 },
     (() => { const r = runPayroll(fullMonth(late));
              return { lateMin:r.lateMin, exempt:r.exemptMin, ded:+r.total.toFixed(2) }; })());

  eq('استئذان تأخير معتمد ⇒ صفر خصم والدقائق تُنقل لـ«معفى»',
     { lateMin:0, exempt:30, ded:0 },
     (() => { const r = runPayroll(fullMonth(late), [permOn('2026-06-01','تأخير عن الدوام')]);
              return { lateMin:r.lateMin, exempt:r.exemptMin, ded:+r.total.toFixed(2) }; })());

  /* ⚠️ الحارس الحقيقي: طلب لم يُعتمد بعد لا يُعفي شيئاً */
  eq('استئذان «تحت المراجعة» لا يُعفي',
     { lateMin:30, ded:18.75 },
     (() => { const r = runPayroll(fullMonth(late), [permOn('2026-06-01','تأخير عن الدوام','pending')]);
              return { lateMin:r.lateMin, ded:+r.total.toFixed(2) }; })());
  eq('واستئذان مرفوض لا يُعفي',
     30, runPayroll(fullMonth(late), [permOn('2026-06-01','تأخير عن الدوام','rejected')]).lateMin);
  eq('واستئذان معتمد ليومٍ آخر لا يُعفي',
     30, runPayroll(fullMonth(late), [permOn('2026-06-02','تأخير عن الدوام')]).lateMin);
  /* ⚠️ النوع يقرّر أي دقائق تُعفى — «خروج مبكر» لا يمحو تأخير الصباح */
  eq('واستئذان «خروج مبكر» لا يُعفي تأخير الدخول',
     30, runPayroll(fullMonth(late), [permOn('2026-06-01','خروج مبكر')]).lateMin);
  const semantic = permOn('2026-06-01','تأخير عن الدوام', 'approved', { id:'stable-request', permissionKind:'late' });
  const semanticPay = runPayroll(fullMonth(late), [semantic]);
  eq('الحقل الدلالي المتوافق مع الفئة يعفي', 0, semanticPay.lateMin);
  eq('تفصيل المسير يحتفظ بمعرّف الطلب الأصلي', 'stable-request',
     semanticPay.details.find((d) => d.dateStr === '2026-06-01').permissions[0].id);
  eq('permissionKind متناقض مع الفئة يفشل مغلقاً', 30,
     runPayroll(fullMonth(late), [permOn('2026-06-01','خروج مبكر','approved', { permissionKind:'late' })]).lateMin);
}
{
  const early = { '2026-06-01': rec('2026-06-01','08:00','15:00') };
  eq('استئذان خروج مبكر معتمد يُعفي الخروج',
     { early:0, exempt:60, ded:0 },
     (() => { const r = runPayroll(fullMonth(early), [permOn('2026-06-01','خروج مبكر')]);
              return { early:r.earlyMin, exempt:r.exemptMin, ded:+r.total.toFixed(2) }; })());
  eq('واستئذان «تأخير» لا يُعفي الخروج المبكر',
     60, runPayroll(fullMonth(early), [permOn('2026-06-01','تأخير عن الدوام')]).earlyMin);
}

/* الشكل الجديد يحمل فترة صريحة. Legacy أعلاه يبقى مقصوداً لإثبات عدم
   الحاجة إلى Migration، بينما هذه الحالات تمسك التغطية الجزئية وMid. */
const INTERVAL_KIND = {
  'تأخير عن الدوام':'late', 'خروج مبكر':'early', 'استئذان أثناء الدوام':'mid'
};
const intervalPerm = (date, category, startTime, endTime, status='approved', over={}) => ({
  id:`ip-${date}-${category}-${startTime}`, type:'permission', status, employeeUid:'e1', date,
  category, categoryLabel:category, permissionKind:INTERVAL_KIND[category], startTime, endTime,
  reasonLabel:'مهمة عمل', note:'زيارة عميل', ...over
});
const multiRec = (date, pairs) => ({ employeeUid:'e1', date,
  sessions:pairs.map(([i,o,endDate=date]) => ({ in:at(date,i), out:o ? at(endDate,o) : null })) });
const featureDay = (record, permissions=[]) => buildDailyStatus(CYC, [EMP], permissions,
  fullMonth({ '2026-06-01':record })).find((r) => r.dateStr === '2026-06-01');

{
  const D='2026-06-01', lateRec=rec(D,'08:30','16:00');
  const full=intervalPerm(D,'تأخير عن الدوام','08:00','08:30');
  const partial=intervalPerm(D,'تأخير عن الدوام','08:00','08:15');
  const presented=attendancePresentation(featureDay(lateRec,[full]));
  eq('عرض Late يستخدم الدخول الرسمي ويحفظ الفعلي في الملاحظة', {
    official:'08:00', actual:'08:30', note:'دخول فعلي 08:30 — استئذان معتمد 08:00–08:30'
  }, {
    official:presented.officialIn.toTimeString().slice(0,5),
    actual:presented.actualIn.toTimeString().slice(0,5), note:presented.note
  });
  const partialPresentation=attendancePresentation(featureDay(lateRec,[partial]));
  eq('عرض Late الجزئي لا يخفي الفجوة غير المغطاة', {
    official:'08:30', note:'استئذان معتمد 08:00–08:15', uncovered:15
  }, {
    official:partialPresentation.officialIn.toTimeString().slice(0,5),
    note:partialPresentation.note, uncovered:partialPresentation.uncoveredMin
  });
  eq('Late صريح كامل يعوّض الدقائق المغطاة فقط', { late:0, exempt:30, hours:8, ded:0 },
     (() => { const r=runPayroll(fullMonth({[D]:lateRec}),[full]); const d=r.details.find(x=>x.dateStr===D);
       return { late:r.lateMin, exempt:r.exemptMin, hours:d.effectiveSecs/3600, ded:r.dedHours }; })());
  eq('Late صريح جزئي يبقي النقص خارجه', { late:15, exempt:15, hours:7.75, ded:9.38 },
     (() => { const r=runPayroll(fullMonth({[D]:lateRec}),[partial]); const d=r.details.find(x=>x.dateStr===D);
       return { late:r.lateMin, exempt:r.exemptMin, hours:d.effectiveSecs/3600,
         ded:+r.dedHours.toFixed(2) }; })());
}
{
  const D='2026-06-01', earlyRec=rec(D,'08:00','15:00');
  const full=intervalPerm(D,'خروج مبكر','15:00','16:00');
  const partial=intervalPerm(D,'خروج مبكر','15:30','16:00');
  const day=featureDay(earlyRec,[full]);
  const presented=attendancePresentation(day);
  const pay=runPayroll(fullMonth({[D]:earlyRec}),[full]);
  eq('Early صريح كامل يحتسب نهاية الوردية ويحفظ الخروج الفعلي',
     { actual:'15:00', effective:'16:00', actualH:7, effectiveH:8, early:0 }, {
       actual:day.lastOut.toTimeString().slice(0,5), effective:day.effectiveOut.toTimeString().slice(0,5),
       actualH:day.actualSecs/3600, effectiveH:day.secs/3600, early:pay.earlyMin
     });
  eq('ملاحظة Early تعرض الدليل الفعلي ونهاية الوردية', true,
     /خروج فعلي 15:00.*استئذان خروج مبكر معتمد حتى نهاية الوردية 16:00/.test(day.note));
  eq('عرض Early يختصر الدليل ويعرض الخروج الرسمي', {
    kind:'خروج مبكر', period:'استئذان معتمد 15:00–16:00',
    official:'16:00', actual:'15:00', note:'خروج فعلي 15:00 — استئذان معتمد 15:00–16:00'
  }, {
    kind:presented.permissionType, period:presented.permissionNote,
    official:presented.officialOut.toTimeString().slice(0,5),
    actual:presented.actualOut.toTimeString().slice(0,5), note:presented.note
  });
  const partialPresentation=attendancePresentation(featureDay(earlyRec,[partial]));
  eq('عرض Early الجزئي لا يحول الخروج إلى نهاية الوردية', {
    official:'15:00', note:'استئذان معتمد 15:30–16:00', uncovered:30
  }, {
    official:partialPresentation.officialOut.toTimeString().slice(0,5),
    note:partialPresentation.note, uncovered:partialPresentation.uncoveredMin
  });
  eq('Early صريح جزئي يبقي النقص خارجه', { early:30, exempt:30, hours:7.5, ded:18.75 },
     (() => { const r=runPayroll(fullMonth({[D]:earlyRec}),[partial]); const d=r.details.find(x=>x.dateStr===D);
       return { early:r.earlyMin, exempt:r.exemptMin, hours:d.effectiveSecs/3600, ded:r.dedHours }; })());
}
{
  /* نفس أوقات الحالة الفعلية التي كشفت الالتباس في مراجعة الرواتب. نختبر
     التركيبات الأربع من خرج المحرك حتى صف التقرير، لا helper معزولاً فقط. */
  const workWeek = Object.fromEntries(Object.entries(WEEK).map(([dow, shift]) => [dow,
    shift.type === 'off' ? shift : { ...shift, start:'09:00', end:'18:00' }]));
  settings({ shifts:workWeek });
  const D='2026-06-01', actual={ employeeUid:'e1', date:D, sessions:[{
    in:new Date(`${D}T09:29:00`), out:new Date(`${D}T16:49:35`)
  }] };

const D = '2026-06-07';

/* بصمات خام كما يكتبها الجسر: التناوب يقفل جلسة ويفتح التي بعدها.
   punches('09:50','10:47','18:00') = الحالة الواقعية — بصم، ثم نسي أنه بصم
   فجرّب ثانية، ثم بصم انصرافه. الثالثة صارت «دخولاً» مفتوحاً. */
function punches(dateStr, ...hms) {
  const sessions = [];
  hms.forEach((hm) => {
    const open = sessions.length && !sessions[sessions.length - 1].out;
    if (open) sessions[sessions.length - 1].out = at(dateStr, hm);
    else      sessions.push({ in: at(dateStr, hm), out: null });
  });
  return { employeeUid: 'e1', date: dateStr, sessions };
}

/* ⚠️ onload لا img.decode(): decode() على صورة خارج المستند قد لا تُحسم
   أبداً في كروم، فتتعلّق المجموعة بلا خطأ ولا نتيجة. */
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = () => rej(new Error('img-load-failed'));
  i.src = src;
});
async function imgFile(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#3a1020'); g.addColorStop(1,'#e8d8c0');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  c.fillStyle = '#fff'; c.font = Math.round(h/8)+'px sans-serif';
  c.fillText('LOC', w/6, h/2);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.95));
  return new File([blob], 'shot.jpg', { type:'image/jpeg' });
}
{
  const dataUrl = await compress(await imgFile(4000, 3000));
  eq('الصورة تُضغط إلى JPEG', true, dataUrl.startsWith('data:image/jpeg'));
  eq('وتبقى دون حدّ القاعدة (٢٤٠ ألف حرف)', true, dataUrl.length < 240000);
  const img = await loadImg(dataUrl);
  eq('وعرضها يُصغَّر إلى ٦٤٠', 640, img.width);
  eq('ونسبتها محفوظة (٤:٣ ⇒ ٤٨٠)', 480, img.height);
}
{
  const img = await loadImg(await compress(await imgFile(320, 240)));
  eq('الصورة الأصغر من ٦٤٠ لا تُكبَّر', 320, img.width);
}
{
  let threw = null;
  try { await compress(new File([new Uint8Array([1,2,3])], 'x.jpg', { type:'image/jpeg' })); }
  catch (e) { threw = e.message; }
  eq('ملف غير صالح يرمي photo-unreadable', 'photo-unreadable', threw);
}
