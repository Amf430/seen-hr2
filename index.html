<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5A1A1A" />
<meta name="description" content="نظام إدارة الموارد البشرية — سين العقارية" />
<title>إدارة الموارد البشرية — سين العقارية</title>

<!-- منع تضمين الموقع داخل إطار في موقع آخر (clickjacking) -->
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- SheetJS ليست وحدة ES — تُحمَّل كسكربت عادي وتُستعمل من window.XLSX.
     integrity يمنع تنفيذ ملف مختلف لو اختُرق الـ CDN يوماً. -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"
        integrity="sha384-gx12pQMMYnabkTgbCHqqrT65RwDnXI/f/dU2H9JUmT0KUeiMF5bf+yroQBmX0Nuk"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- ترتيب التحميل مقصود: المتغيّرات ثم الأساس ثم الهيكل ثم المكوّنات ثم
     الشاشات ثم المساعدات (تُحمَّل أخيراً لتتغلّب بلا !important).
     بلا @import — لأنه يسلسل التحميل ويؤخّر أول رسم. -->
<link rel="stylesheet" href="css/00-tokens.css">
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-layout.css">
<link rel="stylesheet" href="css/03-components.css">
<link rel="stylesheet" href="css/04-screens.css">
<link rel="stylesheet" href="css/05-utilities.css">
</head>

<body>

<a href="#view" class="skip-link">تخطَّ إلى المحتوى</a>

<!-- ============ التحميل ============ -->
<div id="bootLoading" class="loading"><span class="spinner"></span> جارٍ التحميل…</div>

<!-- ============ الدخول ============ -->
<div id="loginScreen" class="hidden">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">س</div>
    <h1>إدارة الموارد البشرية</h1>
    <p class="sub">سين العقارية</p>
    <div class="field">
      <label for="loginEmail">رقم الجوال</label>
      <input id="loginEmail" type="text" inputmode="numeric" placeholder="05xxxxxxxx" autocomplete="username" />
    </div>
    <div class="field">
      <label for="loginPass">كلمة المرور</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn">تسجيل الدخول</button>
    <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
    <button class="btn link" id="resetBtn">نسيت كلمة المرور؟</button>
    <div class="dev-credit">جميع الحقوق محفوظة — تطوير علاء فياض</div>
  </main>
</div>

<!-- ============ تغيير كلمة المرور لأول مرة ============ -->
<div id="pwScreen" class="hidden">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">س</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">لأول مرة، الرجاء تغيير كلمة المرور المبدئية قبل المتابعة</p>
    <div class="field">
      <label for="pwNew">كلمة المرور الجديدة</label>
      <input id="pwNew" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="pwConfirm">تأكيد كلمة المرور</label>
      <input id="pwConfirm" type="password" placeholder="أعد كتابتها" autocomplete="new-password" />
    </div>
    <button class="btn" id="pwSaveBtn">حفظ ومتابعة</button>
    <div class="err" id="pwErr" role="alert" aria-live="polite"></div>
  </main>
</div>

<!-- ============ التطبيق ============ -->
<div id="app" class="hidden">
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="brand-mark" aria-hidden="true">س</div>
      <div><b>إدارة الموارد البشرية</b><span>سين العقارية</span></div>
    </div>
    <nav class="nav" id="navLinks" aria-label="التنقّل الرئيسي"></nav>
    <div class="foot">
      <div class="who" id="sideName">—</div>
      <div class="role" id="sideRole">—</div>
      <button id="logoutBtn">تسجيل الخروج</button>
      <div class="dev-credit dev-credit--dark">تطوير علاء فياض</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة"
              aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="page-head">
        <h2 id="pageTitle">الرئيسية</h2>
        <div class="hint" id="pageHint"></div>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
