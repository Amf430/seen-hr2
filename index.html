    <div class="detail-line"><span class="k">عنوان الجهاز</span><span class="v">${esc(d.deviceIp||'—')}</span></div>
    <div class="detail-line"><span class="k">سجلات في الجهاز</span><span class="v">${d.readCount!=null?d.readCount:'—'}</span></div>
    <div class="detail-line"><span class="k">رُفع في آخر دورة</span><span class="v">${d.newCount!=null?d.newCount:'—'}</span></div>
    <div class="detail-line"><span class="k">موظفون لهم رقم وظيفي</span><span class="v">${d.employeeCount!=null?d.employeeCount:'—'}</span></div>
    ${d.error?`<div class="detail-line"><span class="k">آخر خطأ</span><span class="v" style="color:var(--red)">${esc(d.error)}</span></div>`:''}
    ${unk.length?`<p class="help" style="color:var(--amber);margin-top:10px">⚠️ أرقام بصمة غير مرتبطة بأي موظف: <b>${unk.map(esc).join(', ')}</b><br>
      اذهب لـ «الموظفون» واكتب هذا الرقم في حقل «الرقم الوظيفي» للموظف الصحيح.</p>`:''}`;
}

function attendancePage(v,opt){
  const cycles=recentCyclesList(12);

  const head=el('div','card');
  head.appendChild(el('h3','', opt.isDevice?'🖐️ بصمات جهاز ZKTeco':'🕐 حضور الموقع (تسجيل ذاتي أونلاين)'));
  head.appendChild(el('p','desc', opt.isDevice
    ? 'سجلات قادمة من جهاز البصمة عبر الجسر — لا يستطيع الموظف تعديلها. مستقلة تماماً عن تسجيل الموقع.'
    : 'سجلات يسجّلها الموظف بنفسه من الموقع (موقع جغرافي + بصمة جهازه). مستقلة تماماً عن بصمات جهاز ZKTeco.'));

  const controls=el('div','filters');
  controls.innerHTML=`
    <div class="field"><label>الدورة الشهرية</label><select id="atCyc">${cycles.map((c,i)=>`<option value="${i}">${c.label}${i===0?' (الحالية)':''}</option>`).join('')}</select></div>
    <div class="field"><label>طريقة العرض</label><select id="atMode">
      <option value="daily">التقرير اليومي (حاضر/متأخر/غائب/إجازة)</option>
      <option value="sessions">سجل الدخول/الخروج التفصيلي</option></select></div>
    <div class="field"><label>الموظف</label><select id="atEmp"><option value="">كل الموظفين</option></select></div>
    <div class="field"><label>يوم محدّد</label><input id="atDate" type="date"></div>
    <div class="field"><label>الحالة</label><select id="atStatus">
      <option value="">كل الحالات</option><option value="present">حاضر</option><option value="late">متأخر</option>
      <option value="absent">غائب</option><option value="leave">إجازة</option></select></div>
    <div class="field" style="flex:1;min-width:150px"><label>بحث حر</label><input id="atSearch" placeholder="🔍 اسم أو رقم وظيفي…"></div>`;
  head.appendChild(controls);

  const quick=el('div','');
  quick.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:4px';
  const bToday=el('button','btn sm ghost','📅 اليوم');
  const bYest =el('button','btn sm ghost','📅 أمس');
  const bClear=el('button','btn sm ghost','✖️ مسح الفرز');
  quick.append(bToday,bYest,bClear); head.appendChild(quick);
  v.appendChild(head);

  if(opt.isDevice) bridgeStatusCard(v);

  const host=el('div',''); v.appendChild(host);

  const ddCyc=controls.querySelector('#atCyc'), ddMode=controls.querySelector('#atMode'),
        ddEmp=controls.querySelector('#atEmp'), inDate=controls.querySelector('#atDate'),
        ddStat=controls.querySelector('#atStatus'), search=controls.querySelector('#atSearch');

  let recs=[], loadedKey='';

  function fillEmps(){
    const cur=ddEmp.value;
    const list=[...CACHE_USERS].filter(u=>u.role!=='admin').sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    ddEmp.innerHTML='<option value="">كل الموظفين</option>'+
      list.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}${u.empId?' — '+esc(u.empId):''}</option>`).join('');
    ddEmp.value=cur;
  }
  function matchQ(name,empId){
    const q=search.value.trim(); if(!q) return true;
    return (name||'').includes(q)||String(empId||'').includes(q);
  }

  /* الصفوف المفلترة — تُستخدم للعرض وللتصدير معاً */
  function dailyRows(cyc){
    let rows=buildDailyStatus(cyc,CACHE_USERS,CACHE_REQUESTS,recs);
    if(ddEmp.value) rows=rows.filter(r=>r.u.id===ddEmp.value);
    if(inDate.value) rows=rows.filter(r=>r.dateStr===inDate.value);
    if(ddStat.value) rows=rows.filter(r=>r.cls===ddStat.value);
    return rows.filter(r=>matchQ(r.u.name,r.u.empId));
  }
  function sessRows(){
    let rows=flattenSessions(recs);
    if(ddEmp.value) rows=rows.filter(x=>x.r.employeeUid===ddEmp.value);
    if(inDate.value) rows=rows.filter(x=>x.r.date===inDate.value);
    return rows.filter(x=>matchQ(x.r.employeeName,x.r.employeeEmpId));
  }

  function drawDaily(card,rows){
    if(!rows.length){card.appendChild(el('div','empty','<div class="big">🗓️</div>لا بيانات مطابقة للفرز الحالي'));return;}
    const wrap=el('div','table-wrap');
    wrap.innerHTML=`<table><thead><tr><th>الموظف</th><th>الرقم الوظيفي</th><th>التاريخ</th><th>اليوم</th><th>الحالة</th><th>دخول</th><th>خروج</th><th>الساعات</th><th>ملاحظة</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${esc(r.u.name)}</b></td><td>${esc(r.u.empId||'—')}</td><td>${esc(r.dateStr)}</td><td>${AR_DAYS[r.dow]}</td>
        <td><span class="pill ${r.cls}">${esc(r.status)}</span></td>
        <td style="color:var(--green);font-weight:700">${r.firstIn?hm(r.firstIn):'—'}</td>
        <td style="color:var(--red);font-weight:700">${r.lastOut?hm(r.lastOut):'—'}</td>
        <td>${r.secs>0?fmtDur(r.secs):'—'}</td>
        <td style="font-size:12.5px;color:var(--muted)">${esc(r.note||'')}</td></tr>`).join('')}</tbody></table>`;
    card.appendChild(wrap);
  }
  function drawSessions(card,rows){
    if(!rows.length){card.appendChild(el('div','empty','<div class="big">🕐</div>لا سجلات مطابقة للفرز الحالي'));return;}
    const wrap=el('div','table-wrap');
    wrap.innerHTML=`<table><thead><tr><th>الموظف</th><th>الرقم الوظيفي</th><th>التاريخ</th><th>اليوم</th><th>#</th><th>دخول</th><th>خروج</th><th>المدة</th><th>المصدر</th></tr></thead>
      <tbody>${rows.map(row=>{const s=row.s||{};
        const dur=(s.in&&s.out)?fmtDur((tsToDate(s.out)-tsToDate(s.in))/1000):(s.in?'<span style="color:var(--green)">مفتوحة</span>':'—');
        const src=(s.source||row.r.source||(opt.isDevice?'device':'web'))==='device'?'🖐️ الجهاز':'🌐 الموقع';
        return `<tr><td><b>${esc(row.r.employeeName)}</b></td><td>${esc(row.r.employeeEmpId||'—')}</td>
          <td>${esc(row.r.date)}</td><td>${AR_DAYS[row.r.dow]||''}</td><td>${row.idx+1}</td>
          <td style="color:var(--green);font-weight:700">${s.in?hm(s.in):'—'}</td>
          <td style="color:var(--red);font-weight:700">${s.out?hm(s.out):'—'}</td>
          <td>${dur}</td><td style="font-size:12.5px">${src}</td></tr>`;}).join('')}</tbody></table>`;
    card.appendChild(wrap);
  }

  async function draw(){
    const idx=+ddCyc.value, cyc=cycles[idx];
    const key=opt.coll+'#'+idx;
    if(key!==loadedKey){
      host.innerHTML='<div class="card"><div class="empty"><span class="spinner"></span> جارٍ التحميل…</div></div>';
      try{ await refreshUsers(); recs=await fetchAttendance(cyc,opt.coll); loadedKey=key; fillEmps(); }
      catch(e){ console.error(e); host.innerHTML='<div class="card"><div class="empty">تعذّر التحميل — تأكد من نشر قواعد الأمان المحدّثة</div></div>'; return; }
    }
    host.innerHTML='';
    const isDaily=ddMode.value==='daily';
    ddStat.disabled=!isDaily; ddStat.style.opacity=isDaily?'1':'.5';
    const rows=isDaily?dailyRows(cyc):sessRows();

    const card=el('div','card');
    const bar=el('div','');bar.style.cssText='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px';
    const t=`${isDaily?'التقرير اليومي':'سجل الدخول/الخروج'} — ${cyc.label}`;
    bar.appendChild(el('h3','',t));
    const exp=el('button','btn sm','⬇️ تصدير المعروض (Excel)');
    exp.onclick=()=>attendanceExport(cyc,opt,isDaily?rows:null,isDaily?null:rows);
    bar.appendChild(exp); card.appendChild(bar);

    const bits=[];
    if(ddEmp.value){const u=CACHE_USERS.find(x=>x.id===ddEmp.value);bits.push('الموظف: '+(u?u.name:'—'));}
    if(inDate.value) bits.push('اليوم: '+inDate.value);
    if(isDaily&&ddStat.value) bits.push('الحالة: '+ddStat.options[ddStat.selectedIndex].text);
    card.appendChild(el('p','desc',`${rows.length} نتيجة${bits.length?' · فرز: '+bits.join(' · '):''}`));

    if(isDaily) drawDaily(card,rows); else drawSessions(card,rows);
    host.appendChild(card);
  }

  const setDate=(d)=>{inDate.value=ymd(d);draw();};
  bToday.onclick=()=>setDate(new Date());
  bYest.onclick =()=>{const d=new Date();d.setDate(d.getDate()-1);setDate(d);};
  bClear.onclick=()=>{ddEmp.value='';inDate.value='';ddStat.value='';search.value='';draw();};

  ddCyc.onchange=draw; ddMode.onchange=draw; ddEmp.onchange=draw;
  inDate.onchange=draw; ddStat.onchange=draw; search.oninput=draw;
  draw();
}

function attendanceExport(cyc,opt,dailyRowsList,sessRowsList){
  const tag=opt.isDevice?'بصمات_الجهاز':'حضور_الموقع';
  const wb=XLSX.utils.book_new();
  if(dailyRowsList){
    const rows=dailyRowsList.map(r=>({
      'الموظف':r.u.name,'الرقم الوظيفي':r.u.empId||'','القسم':r.u.department||'',
      'التاريخ':r.dateStr,'اليوم':AR_DAYS[r.dow],'الوردية':r.shift?((r.shift.type==='evening'?'مسائي ':'صباحي ')+(r.shift.start||'')+'–'+(r.shift.end||'')):'',
      'الحالة':r.status,'دخول':r.firstIn?hm(r.firstIn):'','خروج':r.lastOut?hm(r.lastOut):'',
      'ساعات العمل':r.secs>0?(r.secs/3600).toFixed(2):'','ملاحظة':r.note||''
    }));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'لا يوجد':''}]),'التقرير اليومي');
  }
  if(sessRowsList){
    const rows=sessRowsList.map(row=>{const s=row.s||{};
      let hours=''; if(s.in&&s.out) hours=((tsToDate(s.out)-tsToDate(s.in))/3600000).toFixed(2);
      return {'الموظف':row.r.employeeName,'الرقم الوظيفي':row.r.employeeEmpId||'','القسم':row.r.department||'',
        'التاريخ':row.r.date,'اليوم':AR_DAYS[row.r.dow]||'','الوردية':row.r.shiftLabel||'','الجلسة':row.idx+1,
        'وقت الحضور':hm(s.in),'وقت الانصراف':hm(s.out),'ساعات العمل':hours,
        'المصدر':(s.source||row.r.source||(opt.isDevice?'device':'web'))==='device'?'جهاز البصمة':'الموقع'};
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'لا يوجد':''}]),'الجلسات التفصيلية');
  }
  XLSX.writeFile(wb,`${tag}_${cyc.key}.xlsx`);
  toast('تم تصدير المعروض','ok');
}

/* ═══════════════ مسير الرواتب الشهري (تقرير منفصل) ═══════════════ */
async function pagePayroll(v,my){
  const cycles=recentCyclesList(12);
  const cfg=payrollConfig();

  const head=el('div','card');
  head.appendChild(el('h3','','💰 مسير الرواتب — الدورة من 26 إلى 25'));
  head.appendChild(el('p','desc',
    `قيمة اليوم = الراتب ÷ ${cfg.daysPerMonth} · قيمة الساعة = قيمة اليوم ÷ ${cfg.hoursPerDay}. `
    +`الخصم بالساعات للتأخير والخروج المبكر، والغياب بخصم يوم كامل. `
    +`المصدر: بصمات جهاز ZKTeco فقط.`));
  const dd=el('select','');
  dd.style.cssText='width:100%;max-width:360px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px';
  dd.innerHTML=cycles.map((c,i)=>`<option value="${i}">${c.label}${i===0?' (الحالية — غير مكتملة)':''}</option>`).join('');
  head.appendChild(dd); v.appendChild(head);

  const host=el('div',''); v.appendChild(host);

  async function draw(){
    const cyc=cycles[+dd.value];
    host.innerHTML='<div class="card"><div class="empty"><span class="spinner"></span> جارٍ حساب المسير…</div></div>';
    let recs=[];
    try{ await refreshUsers(); recs=await fetchAttendance(cyc,'zkAttendance'); }
    catch(e){ console.error(e); host.innerHTML='<div class="card"><div class="empty">تعذّر التحميل — تأكد من نشر قواعد الأمان</div></div>'; return; }
    if(my!==undefined && my!==renderSeq) return;

    const rowsPay=computePayroll(cyc,CACHE_USERS,CACHE_REQUESTS,recs);
    const noSalary=rowsPay.filter(r=>!r.salary).length;
    const tot=rowsPay.reduce((a,r)=>({
      salary:a.salary+r.salary, dedHours:a.dedHours+r.dedHours, dedAbsent:a.dedAbsent+r.dedAbsent,
      dedUnpaid:a.dedUnpaid+r.dedUnpaid, total:a.total+r.total, net:a.net+r.net,
      lateMin:a.lateMin+r.lateMin, earlyMin:a.earlyMin+r.earlyMin, missingOut:a.missingOut+r.missingOut
    }),{salary:0,dedHours:0,dedAbsent:0,dedUnpaid:0,total:0,net:0,lateMin:0,earlyMin:0,missingOut:0});

    host.innerHTML='';

    if(+dd.value===0){
      const w=el('div','card');
      w.style.cssText='background:var(--amber-bg);border-color:var(--amber)';
      w.innerHTML='<b style="color:var(--amber)">⚠️ الدورة الحالية لم تنتهِ بعد</b><div class="help">الأرقام تُحسب حتى اليوم فقط، وستتغيّر حتى تاريخ 25.</div>';
      host.appendChild(w);
    }
    if(noSalary){
      const w=el('div','card');
      w.style.cssText='background:var(--red-bg);border-color:var(--red)';
      w.innerHTML=`<b style="color:var(--red)">${noSalary} موظف بلا راتب محدّد</b><div class="help">افتح بروفايل الموظف وأضف الراتب، وإلا سيظهر مستحقّه صفراً.</div>`;
      host.appendChild(w);
    }
    if(tot.missingOut){
      const w=el('div','card');
      w.style.cssText='background:#f6ecfa;border-color:#7b2d8e';
      w.innerHTML=`<b style="color:#7b2d8e">${tot.missingOut} يوم بلا بصمة انصراف</b><div class="help">في هذه الأيام حُسبت ساعات الوردية المطلوبة ناقص التأخير. راجعها قبل اعتماد المسير.</div>`;
      host.appendChild(w);
    }

    const g=el('div','grid cols-4');
    g.append(stat(money(tot.salary),'إجمالي الرواتب الأساسية'),
             stat(money(tot.total),'إجمالي الخصومات','r'),
             stat(money(tot.net),'إجمالي المستحق','g'),
             stat(rowsPay.length,'عدد الموظفين'));
    host.appendChild(g);

    const g2=el('div','grid cols-3');
    g2.append(stat(hhmm(tot.lateMin),'إجمالي التأخير','a'),
              stat(hhmm(tot.earlyMin),'إجمالي الخروج المبكر','a'),
              stat(money(tot.dedAbsent+tot.dedUnpaid),'خصم الغياب والإجازات غير المدفوعة','r'));
    host.appendChild(g2);

    const card=el('div','card');
    const bar=el('div','');bar.style.cssText='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px';
    bar.appendChild(el('h3','',`مسير ${cyc.label}`));
    const exp=el('button','btn sm','⬇️ تصدير المسير (Excel)');
    exp.onclick=()=>payrollExport(cyc,rowsPay);
    bar.appendChild(exp); card.appendChild(bar);

    if(!rowsPay.length) card.appendChild(el('div','empty','لا يوجد موظفون'));
    else{
      const wrap=el('div','table-wrap');
      wrap.innerHTML=`<table class="tight"><thead><tr>
        <th>الموظف</th><th>القسم</th><th>الراتب</th><th>قيمة الساعة</th>
        <th>أيام العمل</th><th>حضور</th><th>غياب</th><th>إجازة مدفوعة</th><th>بدون راتب</th>
        <th>تأخير</th><th>خروج مبكر</th><th>خصم ساعات</th><th>خصم غياب</th><th>إجمالي الخصم</th><th>المستحق</th></tr></thead>
        <tbody>${rowsPay.map(r=>`<tr>
          <td><b>${esc(r.u.name)}</b>${r.missingOut?' <span class="pill missing" style="font-size:11px">'+r.missingOut+' بلا انصراف</span>':''}</td>
          <td>${esc(r.u.department||'—')}</td>
          <td class="money">${r.salary?money(r.salary):'<span style="color:var(--red)">—</span>'}</td>
          <td class="money">${money(r.hourRate)}</td>
          <td>${r.workDays}</td>
          <td style="color:var(--green)">${r.presentDays}</td>
          <td style="color:var(--red)">${r.absentDays||'—'}</td>
          <td>${r.paidLeaveDays||'—'}</td>
          <td>${r.unpaidDays||'—'}</td>
          <td>${r.lateMin?hhmm(r.lateMin):'—'}</td>
          <td>${r.earlyMin?hhmm(r.earlyMin):'—'}</td>
          <td class="money neg">${r.dedHours?('− '+money(r.dedHours)):'—'}</td>
          <td class="money neg">${(r.dedAbsent+r.dedUnpaid)?('− '+money(r.dedAbsent+r.dedUnpaid)):'—'}</td>
          <td class="money neg">${r.total?('− '+money(r.total)):'—'}</td>
          <td class="money net">${money(r.net)}</td></tr>`).join('')}
        <tr style="background:var(--maroon-tint);font-weight:800">
          <td colspan="11">الإجمالي</td>
          <td class="money neg">− ${money(tot.dedHours)}</td>
          <td class="money neg">− ${money(tot.dedAbsent+tot.dedUnpaid)}</td>
          <td class="money neg">− ${money(tot.total)}</td>
          <td class="money net">${money(tot.net)}</td></tr></tbody></table>`;
      card.appendChild(wrap);
      card.appendChild(el('p','help','اضغط على «بروفايل» في صفحة الموظفين لرؤية تفصيل أيام أي موظف.'));
    }
    host.appendChild(card);
  }
  dd.onchange=draw; await draw();
}

function payrollExport(cyc,rowsPay){
  const cfg=payrollConfig();
  const summary=rowsPay.map(r=>({
    'الموظف':r.u.name,'الرقم الوظيفي':r.u.empId||'','القسم':r.u.department||'','المسمى':r.u.jobTitle||'',
    'الراتب الأساسي':r.salary,'قيمة اليوم':+r.dayRate.toFixed(2),'قيمة الساعة':+r.hourRate.toFixed(2),
    'أيام العمل في الدورة':r.workDays,'أيام الحضور':r.presentDays,'أيام التأخير':r.lateDays,
    'أيام الغياب':r.absentDays,'إجازة مدفوعة (يوم)':r.paidLeaveDays,'إجازة بدون راتب (يوم)':r.unpaidDays,
    'أيام بلا بصمة انصراف':r.missingOut,
    'دقائق التأخير':r.lateMin,'دقائق الخروج المبكر':r.earlyMin,'دقائق معفاة باستئذان':r.exemptMin,
    'ساعات مطلوبة':+r.reqH.toFixed(2),'ساعات فعلية':+r.workH.toFixed(2),
    'خصم الساعات':+r.dedHours.toFixed(2),'خصم الغياب':+r.dedAbsent.toFixed(2),
    'خصم إجازة بدون راتب':+r.dedUnpaid.toFixed(2),
    'إجمالي الخصم':+r.total.toFixed(2),'المستحق':+r.net.toFixed(2)
  }));
  const details=[];
  rowsPay.forEach(r=>r.details.forEach(d=>details.push({
    'الموظف':r.u.name,'الرقم الوظيفي':r.u.empId||'','التاريخ':d.dateStr,'اليوم':AR_DAYS[d.dow]||'',
    'الحالة':d.status,'ساعات مطلوبة':+(d.need||0).toFixed(2),
    'دخول':d.in?hm(d.in):'','خروج':d.out?hm(d.out):'',
    'دقائق تأخير':d.lm||0,'دقائق خروج مبكر':d.em||0,'دقائق معفاة':d.ex||0,
    'خصم اليوم':+(d.ded||0).toFixed(2)
  })));
  const rules=[
    {'البند':'الدورة','القيمة':cyc.label},
    {'البند':'من','القيمة':ymd(cyc.start)},
    {'البند':'إلى','القيمة':ymd(cyc.end)},
    {'البند':'قيمة اليوم','القيمة':'الراتب ÷ '+cfg.daysPerMonth},
    {'البند':'قيمة الساعة','القيمة':'قيمة اليوم ÷ '+cfg.hoursPerDay},
    {'البند':'سماح التأخير','القيمة':(cfg.graceMinutes||0)+' دقيقة'},
    {'البند':'خصم التأخير والخروج المبكر','القيمة':'بالساعات × قيمة الساعة'},
    {'البند':'خصم الغياب','القيمة':'يوم كامل × قيمة اليوم'},
    {'البند':'الإجازات المدفوعة','القيمة':'بلا خصم'},
    {'البند':'إجازة بدون راتب','القيمة':'خصم يوم كامل'},
    {'البند':'الاستئذان المعتمد','القيمة':'معفى من الخصم'},
    {'البند':'مصدر الحضور','القيمة':'بصمات جهاز ZKTeco (zkAttendance)'},
    {'البند':'تاريخ إصدار المسير','القيمة':fmtDate(new Date())},
  ];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary.length?summary:[{'لا يوجد':''}]),'مسير الرواتب');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(details.length?details:[{'لا يوجد':''}]),'تفصيل الأيام');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rules),'قواعد الحساب');
  XLSX.writeFile(wb,`مسير_رواتب_${cyc.key}.xlsx`);
  toast('تم تصدير المسير','ok');
}

/* ---------- الأدمن: التقارير ---------- */
function pageReports(v){
  const byType=t=>CACHE_REQUESTS.filter(r=>r.type===t).length;
  const g=el('div','grid cols-4');
  g.append(stat(byType('permission'),'طلبات استئذان'),stat(byType('leave'),'طلبات إجازة'),
    stat(CACHE_REQUESTS.filter(r=>r.status==='approved').length,'موافق عليها','g'),
    stat(CACHE_REQUESTS.filter(r=>r.status==='rejected').length,'مرفوضة','r'));
  v.appendChild(g);

  // أكثر الموظفين طلباً
  const card=el('div','card');card.appendChild(el('h3','','👤 الطلبات حسب الموظف'));
  const counts={};CACHE_REQUESTS.forEach(r=>{counts[r.employeeName]=(counts[r.employeeName]||0)+1;});
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!rows.length)card.appendChild(el('div','empty','لا بيانات'));
  else{const wrap=el('div','table-wrap');
    wrap.innerHTML=`<table><thead><tr><th>الموظف</th><th>عدد الطلبات</th></tr></thead><tbody>
      ${rows.map(([n,c])=>`<tr><td>${esc(n)}</td><td><b>${c}</b></td></tr>`).join('')}</tbody></table>`;
    card.appendChild(wrap);}
  v.appendChild(card);

  const exp=el('div','card');exp.appendChild(el('h3','','📤 تصدير البيانات'));
  exp.appendChild(el('p','desc','تصدير جميع الطلبات إلى ملف Excel جاهز للطباعة أو الأرشفة.'));
  const b=el('button','btn sm','⬇️ تصدير الطلبات (Excel)');b.onclick=exportExcel;exp.appendChild(b);v.appendChild(exp);
}
function exportExcel(){
  if(!CACHE_REQUESTS.length){toast('لا توجد طلبات للتصدير','err');return;}
  const rows=CACHE_REQUESTS.map(r=>({
    'الموظف':r.employeeName,'الرقم الوظيفي':r.employeeEmpId||'','القسم':r.department||'',
    'النوع':r.type==='permission'?'استئذان':'إجازة','التصنيف':r.categoryLabel,
    'التاريخ/البداية':r.type==='permission'?r.date:r.startDate,
    'الوقت/النهاية':r.type==='permission'?r.time:r.endDate,
    'الأيام':r.type==='leave'?r.days:'','السبب':r.reasonLabel||'',
    'جهة الاعتماد':r.approverName||'','الحالة':STATUS_AR[r.status],
    'سبب الرفض':r.rejectReason||'','روجع بواسطة':r.reviewedBy||''
  }));
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'الطلبات');
  XLSX.writeFile(wb,'طلبات_سين_العقارية.xlsx');toast('تم التصدير','ok');
}

/* ---------- الأدمن: سجل الحركات ---------- */
async function logAction(action,detail){
  try{await addDoc(collection(db,'auditLog'),{action,detail,byName:ME.name,byUid:ME.id,at:serverTimestamp()});}catch(e){}
}
async function pageAudit(v){
  const card=el('div','card');card.appendChild(el('h3','','🗂️ آخر الحركات'));
  const host=el('div','',' <div class="empty"><span class="spinner"></span></div>');card.appendChild(host);v.appendChild(card);
  try{
    const s=await getDocs(query(collection(db,'auditLog'),orderBy('at','desc')));
    const logs=s.docs.map(d=>d.data()).slice(0,100);
    if(!logs.length){host.innerHTML='<div class="empty">لا حركات بعد</div>';return;}
    host.innerHTML=`<div class="table-wrap"><table><thead><tr><th>الحركة</th><th>التفاصيل</th><th>بواسطة</th><th>الوقت</th></tr></thead>
      <tbody>${logs.map(l=>`<tr><td><b>${esc(l.action)}</b></td><td>${esc(l.detail)}</td><td>${esc(l.byName)}</td><td>${fmtDT(l.at)}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){host.innerHTML='<div class="empty">تعذّر تحميل السجل</div>';}
}
</script>
