<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة الموارد البشرية - سين العقارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --maroon:#5A1A1A;
  --maroon-2:#7a2a2a;
  --maroon-tint:#f6eeee;
  --gold:#b8945a;
  --paper:#faf7f4;
  --card:#ffffff;
  --ink:#2b2320;
  --muted:#8a807a;
  --line:#ece4de;
  --green:#1f7a43; --green-bg:#e7f4ec;
  --red:#b32626;   --red-bg:#fbeaea;
  --amber:#c47b16; --amber-bg:#fdf3e3;
  --shadow:0 1px 3px rgba(90,26,26,.06),0 8px 24px rgba(90,26,26,.05);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
#app{overflow-x:hidden}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ---------- Login ---------- */
#loginScreen,#pwScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,#6e2222 0%,var(--maroon) 45%,#3f1010 100%)}
.login-card{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:410px;padding:40px 34px;text-align:center}
.brand-mark{width:64px;height:64px;border-radius:16px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 16px}
.login-card h1{font-size:22px;color:var(--maroon);margin-bottom:4px}
.login-card p.sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.dev-credit{color:var(--muted);font-size:11px;text-align:center;margin-top:18px;opacity:.7}
.field{text-align:right;margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--maroon)}
.btn{background:var(--maroon);color:#fff;padding:12px 20px;border-radius:11px;font-weight:700;font-size:15px;transition:background .15s,transform .05s;width:100%}
.btn:hover{background:var(--maroon-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--line);width:auto}
.btn.ghost:hover{background:var(--maroon-tint)}
.btn.sm{padding:8px 14px;font-size:13px;width:auto}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8f1d1d}
.btn.link{background:none;color:var(--maroon);width:auto;padding:6px;font-size:13px;text-decoration:underline}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--maroon);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sidebar .logo{padding:24px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .logo .brand-mark{width:42px;height:42px;font-size:20px;margin:0;background:rgba(255,255,255,.14)}
.sidebar .logo b{font-size:16px;display:block}
.sidebar .logo span{font-size:12px;color:rgba(255,255,255,.7)}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.82);font-weight:500;font-size:14.5px;cursor:pointer;margin-bottom:3px;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:#fff;color:var(--maroon);font-weight:700}
.nav a .ic{font-size:17px;width:22px;text-align:center}
.nav a .badge{margin-inline-start:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav a.active .badge{background:var(--maroon);color:#fff}
.sidebar .foot{padding:16px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.sidebar .foot .who{color:#fff;font-weight:700}
.sidebar .foot .role{color:rgba(255,255,255,.65);font-size:12px;margin-bottom:10px}
.sidebar .foot button{background:rgba(255,255,255,.12);color:#fff;width:100%;padding:9px;border-radius:9px;font-size:13px;font-weight:500}
.sidebar .foot button:hover{background:rgba(255,255,255,.2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:19px;color:var(--maroon)}
.topbar .hint{color:var(--muted);font-size:13px}
.menu-toggle{display:none;background:var(--maroon-tint);color:var(--maroon);width:40px;height:40px;border-radius:10px;font-size:20px}
.content{padding:26px;max-width:1180px;width:100%}

/* ---------- Cards / grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.card > h3{font-size:16px;color:var(--maroon);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card > p.desc{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .n{font-size:30px;font-weight:800;color:var(--maroon);line-height:1.1}
.stat .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.stat.g .n{color:var(--green)}.stat.r .n{color:var(--red)}.stat.a .n{color:var(--amber)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--maroon-tint);padding:5px;border-radius:12px;margin-bottom:20px;width:fit-content}
.tabs button{padding:9px 22px;border-radius:9px;background:transparent;color:var(--maroon);font-weight:700;font-size:14.5px}
.tabs button.active{background:var(--card);box-shadow:var(--shadow)}

/* ---------- Forms ---------- */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row.one{grid-template-columns:1fr}
textarea{min-height:80px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:5px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{background:var(--maroon-tint);color:var(--maroon);text-align:right;padding:12px 14px;font-weight:700;font-size:13px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fdfbf9}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:8px;height:8px;border-radius:50%}
.pill.approved{background:var(--green-bg);color:var(--green)}.pill.approved::before{background:var(--green)}
.pill.rejected{background:var(--red-bg);color:var(--red)}.pill.rejected::before{background:var(--red)}
.pill.pending{background:var(--amber-bg);color:var(--amber)}.pill.pending::before{background:var(--amber)}
.pill.cancelled{background:#eeecea;color:var(--muted)}.pill.cancelled::before{background:var(--muted)}
.pill.present{background:var(--green-bg);color:var(--green)}.pill.present::before{background:var(--green)}
.pill.late{background:var(--amber-bg);color:var(--amber)}.pill.late::before{background:var(--amber)}
.pill.absent{background:var(--red-bg);color:var(--red)}.pill.absent::before{background:var(--red)}
.pill.leave{background:#e8eef7;color:#2c5aa0}.pill.leave::before{background:#2c5aa0}
.pill.active{background:var(--green-bg);color:var(--green)}.pill.active::before{background:var(--green)}
.pill.suspended{background:#f0eeec;color:var(--muted)}.pill.suspended::before{background:var(--muted)}
.pill.missing{background:#f3e8f7;color:#7b2d8e}.pill.missing::before{background:#7b2d8e}
.pill.holiday{background:#e8f1f7;color:#1f6f8b}.pill.holiday::before{background:#1f6f8b}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.money.neg{color:var(--red)}.money.net{color:var(--green)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--maroon);border-radius:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table.tight{font-size:13px}table.tight th,table.tight td{padding:8px 10px}
.tag{display:inline-block;background:var(--maroon-tint);color:var(--maroon);padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600}

/* chip list (settings) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--maroon-tint);color:var(--maroon);padding:7px 8px 7px 13px;border-radius:20px;font-size:13.5px;font-weight:600}
.chip small{color:var(--muted);font-weight:500}
.chip button{background:rgba(90,26,26,.12);color:var(--maroon);width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.chip button:hover{background:var(--red);color:#fff}
.add-inline{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
.add-inline .field{margin:0;flex:1;min-width:120px}

/* empty */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,35,32,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal h3{color:var(--maroon);margin-bottom:14px;font-size:18px}
.modal .row{display:flex;gap:10px;margin-top:20px}
.modal .row .btn{flex:1}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 24px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast.err{background:var(--red)}#toast.ok{background:var(--green)}

.detail-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.detail-line:last-child{border:none}
.detail-line .k{color:var(--muted)}
.detail-line .v{font-weight:600}

/* ---------- Attendance hero (live clock + work timer) ---------- */
.attend-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#7a2727 0%,var(--maroon) 55%,#3d1010 100%);color:#fff;border-radius:22px;padding:30px 22px 26px;text-align:center;margin-bottom:20px;box-shadow:0 12px 34px rgba(90,26,26,.28)}
.attend-hero::after{content:'';position:absolute;top:-60px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(184,148,90,.35),transparent 70%);pointer-events:none}
.attend-hero .clock-day{font-size:16px;font-weight:700;opacity:.9}
.attend-hero .clock-time{font-size:clamp(44px,12vw,58px);font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.05;margin:2px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.attend-hero .clock-date{font-size:14px;opacity:.8;margin-top:2px}
.attend-hero .shift-line{margin-top:14px;font-size:13px;background:rgba(255,255,255,.14);display:inline-block;padding:6px 16px;border-radius:20px}
.work-timer{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:3px;align-items:center;min-height:56px;justify-content:center}
.work-timer .wt-label{font-size:14px;font-weight:700}
.work-timer .wt-val{font-size:clamp(26px,8vw,32px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.work-timer.live{color:#8affc0}
.work-timer.live .wt-label::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#8affc0;margin-inline-end:7px;animation:pulse 1.4s infinite}
.work-timer.done{color:#ffd9a0}
.work-timer .wt-idle{opacity:.75;font-size:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.att-actions{display:flex;gap:12px;flex-wrap:wrap}
.att-actions .btn{flex:1;min-width:150px;padding:16px;font-size:16px;border-radius:14px}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:end}
.filters .field{margin:0;min-width:150px}

.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--maroon);font-size:16px;font-weight:600}
.spinner{width:22px;height:22px;border:3px solid var(--maroon-tint);border-top-color:var(--maroon);border-radius:50%;animation:spin .7s linear infinite;margin-inline-end:10px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .grid.cols-4{grid-template-columns:1fr 1fr}
  .grid.cols-3{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .sidebar{position:fixed;right:0;top:0;z-index:60;transform:translateX(100%);transition:transform .25s;box-shadow:-6px 0 30px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .content{padding:18px}
  .grid.cols-2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="bootLoading" class="loading"><span class="spinner"></span> جارٍ التحميل…</div>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="hidden">
  <div class="login-card">
    <div class="brand-mark">س</div>
    <h1>إدارة الموارد البشرية</h1>
    <p class="sub">سين العقارية</p>
    <div class="field">
      <label>رقم الجوال</label>
      <input id="loginEmail" type="text" placeholder="05xxxxxxxx" autocomplete="username" />
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn">تسجيل الدخول</button>
    <div class="err" id="loginErr"></div>
    <button class="btn link" id="resetBtn">نسيت كلمة المرور؟</button>
    <div class="dev-credit">جميع الحقوق محفوظة — تطوير علاء فياض</div>
  </div>
</div>

<!-- ============ FIRST-LOGIN PASSWORD CHANGE ============ -->
<div id="pwScreen" class="hidden">
  <div class="login-card">
    <div class="brand-mark">س</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">لأول مرة، الرجاء تغيير كلمة المرور المبدئية قبل المتابعة</p>
    <div class="field">
      <label>كلمة المرور الجديدة</label>
      <input id="pwNew" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" />
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input id="pwConfirm" type="password" placeholder="أعد كتابتها" autocomplete="new-password" />
    </div>
    <button class="btn" id="pwSaveBtn">حفظ ومتابعة</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="brand-mark">س</div>
      <div><b>إدارة الموارد البشرية</b><span>سين العقارية</span></div>
    </div>
    <nav class="nav" id="navLinks"></nav>
    <div class="foot">
      <div class="who" id="sideName">—</div>
      <div class="role" id="sideRole">—</div>
      <button id="logoutBtn">تسجيل الخروج</button>
      <div class="dev-credit" style="color:rgba(255,255,255,.45)">تطوير علاء فياض</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <h2 id="pageTitle">الرئيسية</h2>
        <div class="hint" id="pageHint"></div>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ================= APP LOGIC ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  sendPasswordResetEmail, createUserWithEmailAndPassword, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection,
  addDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ========================================================================
   (١) إعدادات Firebase — الصق بياناتك هنا (اشرحها لك الخطوات في ملف الإرشادات)
   ======================================================================== */
const firebaseConfig = {
  apiKey:      "AIzaSyDYSQpDVA4r-9XjitIMn53VfEuOjG1D3jI",
  authDomain:  "seen-hr2.firebaseapp.com",
  projectId:   "seen-hr2"
  // (اختياري) لو احتجت التحليلات لاحقاً أضف: storageBucket, messagingSenderId, appId, measurementId
};

/* بريد المدير (الأدمن) — أول تسجيل دخول بهذا البريد يُنشئ حساب الأدمن تلقائياً.
   ⚠️ غيّره لبريدك ثم أنشئ نفس البريد في Firebase → Authentication → Add user */
const ADMIN_EMAIL = "alaahoms43@gmail.com";
/* ======================================================================== */

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

/* ---------- حالة عامة ---------- */
let ME = null;               // بيانات المستخدم الحالي (Firestore)
let SETTINGS = { permissionReasons:[], leaveTypes:[], approvers:[], departments:[], dateExceptions:[], payroll:{} };
let PROFILE_UID = null;      // الموظف المعروض في صفحة البروفايل
let currentPage = "home";
let unsubReqs = null;
let unsubMe = null;
let uiTimer = null;          // مؤقّت الساعة الحية ومؤقّت الدوام
let unsubAtt = null;         // اشتراك لحظي على سجل حضور اليوم
let renderSeq = 0;           // حارس ضد تكرار العرض عند التحديثات المتزامنة
let CACHE_REQUESTS = [];      // للأدمن: كل الطلبات / للموظف: طلباته
let CACHE_USERS = [];         // للأدمن فقط

/* ---------- أدوات مساعدة ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Math.random().toString(36).slice(2,9);
function toast(msg,type=''){const t=$('#toast');t.textContent=msg;t.className='show '+type;setTimeout(()=>t.className='',2600);}
function fmtDate(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'2-digit',day:'2-digit'});}
function fmtDT(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('ar-SA-u-ca-gregory',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function daysBetween(a,b){const d=(new Date(b)-new Date(a))/86400000;return Math.max(1,Math.round(d)+1);}
/* أيام الإجازة الفعلية = أيام العمل فقط (تستثني أيام الراحة من إعدادات الشفتات) */
function workingDaysBetween(a,b){
  const sh=SETTINGS.shifts||{};
  const start=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00');
  if(isNaN(start)||isNaN(end)||end<start) return 0;
  let n=0, off=0;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const s=sh[d.getDay()];
    if(s&&s.type==='off') off++; else n++;
  }
  return {days:Math.max(0,n), off};
}

function sortByCreated(arr){return arr.sort((a,b)=>{
  const ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():Date.now();
  const tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():Date.now();
  return tb-ta;});}

/* ===== الدورة الشهرية: تبدأ يوم 26 وتنتهي يوم 25 من الشهر التالي ===== */
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function cycleOf(dateInput){
  const d=(dateInput instanceof Date)?dateInput:new Date(dateInput);
  let startY=d.getFullYear(), startM=d.getMonth();
  if(d.getDate()<26){ startM-=1; if(startM<0){startM=11;startY-=1;} }
  const start=new Date(startY,startM,26,0,0,0,0);
  let endM=startM+1,endY=startY; if(endM>11){endM=0;endY+=1;}
  const end=new Date(endY,endM,25,23,59,59,999);
  const key=`${startY}-${String(startM+1).padStart(2,'0')}`;
  const label=`26 ${AR_MONTHS[startM]} ← 25 ${AR_MONTHS[endM]} ${endY}`;
  return {start,end,key,label,nextReset:new Date(endY,endM,26)};
}
/* تاريخ الحدث الفعلي للطلب (لا تاريخ التقديم): للاستئذان تاريخه، للإجازة تاريخ بدايتها */
function reqEventDate(r){
  const s=r.type==='permission'?r.date:r.startDate;
  if(s) return new Date(s+'T00:00:00');
  return (r.createdAt&&r.createdAt.toDate)?r.createdAt.toDate():new Date();
}
function requestsInCycle(cycle){
  return CACHE_REQUESTS.filter(r=>{const d=reqEventDate(r);return d>=cycle.start&&d<=cycle.end;});
}

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hm(ts){if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function p2(n){return String(n).padStart(2,'0');}
function fmtDur(secs){secs=Math.max(0,secs|0);const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;return `${p2(h)}:${p2(m)}:${p2(s)}`;}

function deptOf(name){
  if(!name) return null;
  return (SETTINGS.departments||[]).find(d=>d.name===name)||null;
}
function dateException(dateStr){
  return (SETTINGS.dateExceptions||[]).find(x=>x.date===dateStr)||null;
}
function resolveShift(dateStr,dow,deptName){
  const ex=dateException(dateStr);
  if(ex){
    if(ex.type==='off') return {type:'off',start:'',end:'',src:'exception',exLabel:ex.label||'عطلة رسمية'};
    return {type:ex.kind||'morning',start:ex.start||'',end:ex.end||'',src:'exception',exLabel:ex.label||'دوام خاص'};
  }
  const d=deptOf(deptName);
  if(d&&d.shifts&&d.shifts[dow]) return {...d.shifts[dow],src:'dept',exLabel:'وردية قسم '+d.name};
  const s=(SETTINGS.shifts||{})[dow];
  return s?{...s,src:'company'}:{type:'off',start:'',end:'',src:'none'};
}
/* عدد ساعات الوردية المطلوبة (يدعم العبور لمنتصف الليل) */
function shiftHours(sh){
  if(!sh||sh.type==='off'||!sh.start||!sh.end) return 0;
  const [h1,m1]=sh.start.split(':').map(Number), [h2,m2]=sh.end.split(':').map(Number);
  let mins=(h2*60+m2)-(h1*60+m1); if(mins<=0) mins+=1440;
  return mins/60;
}
/* نافذة الوردية كتواريخ فعلية على يوم معيّن */
function shiftWindowFor(baseDate,sh){
  if(!sh||sh.type==='off'||!sh.start||!sh.end) return null;
  const st=hmToDate(baseDate,sh.start); let en=hmToDate(baseDate,sh.end);
  if(en<=st) en=new Date(en.getTime()+86400000);
  return {start:st,end:en};
}
function shiftText(sh){
  if(!sh||sh.type==='off') return sh&&sh.exLabel?sh.exLabel:'راحة';
  const kind=sh.type==='evening'?'مسائي':'صباحي';
  return `${kind} ${sh.start||''}–${sh.end||''}`;
}
/* وردية اليوم للمستخدم الحالي */
function myShiftToday(base){
  const d=base||new Date();
  return resolveShift(ymd(d),d.getDay(),ME?ME.department:'');
}
function shiftLabelOf(dow){
  const d=new Date(); d.setDate(d.getDate()+((dow-d.getDay()+7)%7));
  const sh=resolveShift(ymd(d),dow,ME?ME.department:'');
  return shiftText(sh);
}

/* الموقع الجغرافي */
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('no-geo'));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      err=>rej(err),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
function haversine(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

/* البصمة / Face ID عبر WebAuthn */
function bufToB64url(buf){const b=new Uint8Array(buf);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64urlToBuf(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');const pad=b64.length%4;if(pad)b64+='='.repeat(4-pad);const s=atob(b64);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b.buffer;}
function randChallenge(){const a=new Uint8Array(32);crypto.getRandomValues(a);return a.buffer;}
async function bioSupported(){
  if(!(window.PublicKeyCredential&&navigator.credentials)) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return true; }
}
function localCredKey(){return 'seenBioCred_'+(ME?ME.id:'x');}
function getLocalCred(){try{return localStorage.getItem(localCredKey());}catch(e){return null;}}
function setLocalCred(id){try{localStorage.setItem(localCredKey(),id);}catch(e){}}
function clearLocalCred(){try{localStorage.removeItem(localCredKey());}catch(e){}}

async function enrollBiometric(){
  const cred=await navigator.credentials.create({publicKey:{
    challenge:randChallenge(),
    rp:{name:'إدارة الموارد البشرية - سين'},
    user:{id:new TextEncoder().encode(ME.id+'_'+Date.now()),name:ME.name||ME.id,displayName:ME.name||'موظف'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged',requireResidentKey:false},
    timeout:60000,attestation:'none'
  }});
  const id=bufToB64url(cred.rawId);
  setLocalCred(id);
  return id;
}
/* يرجع true عند نجاح التحقق بالبصمة على هذا الجهاز */
async function verifyBiometric(){
  let id=getLocalCred();
  if(!id){ await enrollBiometric(); return true; } /* أول مرة على هذا الجهاز → تسجيل بالبصمة */
  try{
    const a=await navigator.credentials.get({publicKey:{
      challenge:randChallenge(),
      allowCredentials:[{type:'public-key',id:b64urlToBuf(id),transports:['internal']}],
      userVerification:'required',timeout:60000
    }});
    return !!a;
  }catch(e){
    if(e.name==='NotAllowedError') throw e; /* المستخدم ألغى */
    /* البصمة المخزّنة غير صالحة على هذا الجهاز → إعادة تسجيل */
    clearLocalCred(); await enrollBiometric(); return true;
  }
}

/* ===== أدوات جلسات الحضور (دخول/خروج متعدد) ===== */
function tsToDate(ts){return ts?(ts.toDate?ts.toDate():new Date(ts)):null;}
function sessionsOf(d){
  if(!d) return [];
  if(Array.isArray(d.sessions)) return d.sessions;
  if(d.checkIn) return [{in:d.checkIn,out:d.checkOut||null,inLoc:d.checkInLoc,outLoc:d.checkOutLoc}];
  return [];
}
function workedSecs(sessions){
  let t=0,open=false;
  for(const s of sessions){const i=tsToDate(s.in);if(!i)continue;const o=tsToDate(s.out);if(o)t+=(o-i)/1000;else{t+=(Date.now()-i)/1000;open=true;}}
  return {secs:t,open};
}
const GRACE_AFTER_END_MIN=120;   /* سماح لتسجيل الحضور بعد نهاية الوردية */
function shiftEndPassed(){
  const now=new Date();
  const w=shiftWindowFor(now,myShiftToday(now));
  if(!w) return false;
  return now > new Date(w.end.getTime()+GRACE_AFTER_END_MIN*60000);
}

async function fetchAttendance(cycle,coll='attendance'){
  const s1=ymd(cycle.start), s2=ymd(cycle.end);
  const q1=query(collection(db,coll),where('date','>=',s1),where('date','<=',s2));
  const snap=await getDocs(q1);
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}

/* يحوّل رقم الجوال لصيغة بريد داخلي يستخدمها Firebase (يبقى النظام مجانياً بالكامل).
   لو أُدخل بريد حقيقي (يحتوي @) — مثل بريد المدير — يُستخدم كما هو. */
function normPhone(v){
  let d=(v||'').replace(/[^0-9]/g,'');
  if(d.startsWith('00966')) d=d.slice(5);
  else if(d.startsWith('966')) d=d.slice(3);
  if(d.length===9 && d.startsWith('5')) d='0'+d;   /* 5xxxxxxxx → 05xxxxxxxx */
  return d;
}
function toLoginEmail(input){
  const v=(input||'').trim();
  if(v.includes('@')) return v.toLowerCase();
  return normPhone(v)+'@seen-hr.local';
}

async function loadMe(user){
  const ref=doc(db,'users',user.uid);
  const snap=await getDoc(ref);
  if(snap.exists()){ ME={id:user.uid,...snap.data()}; return; }
  // أول دخول ببريد الأدمن: محاولة إنشاء حساب الأدمن تلقائياً.
  // ⚠️ قواعد الأمان المحدّثة تمنع الإنشاء الذاتي، فلو رُفض أنشئ الوثيقة يدوياً
  //    من Firebase Console (users/<UID> مع role:"admin") — الرسالة توضّح ذلك.
  if(user.email===ADMIN_EMAIL){
    const data={name:'مدير الموارد البشرية',empId:'ADMIN',department:'الموارد البشرية',
      jobTitle:'مدير النظام',email:user.email,phone:'',manager:'',hireDate:'',
      role:'admin',status:'active',balances:{},createdAt:serverTimestamp()};
    try{
      await setDoc(ref,data); ME={id:user.uid,...data};
      await seedSettings();
      return;
    }catch(e){
      console.error(e);
      throw new Error('admin-blocked');
    }
  }
  throw new Error('no-profile');
}

  currentPage=page; setActiveNav();
  $('#sidebar').classList.remove('open');
  render();
}

/* اشتراك لحظي بالبيانات */
function subscribeData(){
  if(unsubReqs) unsubReqs();
  if(unsubMe) unsubMe();
  // اشتراك لحظي على ملف المستخدم نفسه — يحدّث الرصيد فوراً عند خصمه أو إعادته دون الحاجة لتسجيل خروج
  unsubMe = onSnapshot(doc(db,'users',ME.id), snap=>{
    if(!snap.exists())return;
    ME = {id:ME.id, ...snap.data()};
    $('#sideName').textContent=ME.name;
    $('#sideRole').textContent = ME.role==='admin' ? 'مدير النظام' : (ME.jobTitle||'موظف');
    if(['home','new','mine'].includes(currentPage)) render();
  },err=>console.error('me',err));
  if(ME.role==='manager'){
    /* مدير القسم: طلبات قسمه فقط (تشمل طلباته الشخصية) */
    const q1=query(collection(db,'requests'),where('department','==',ME.department||'—'));
    unsubReqs=onSnapshot(q1,snap=>{
      CACHE_REQUESTS=sortByCreated(snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status!=='cancelled'||r.employeeUid===ME.id));
      updateBadges(); if(['home','inbox','mine'].includes(currentPage)) render();
    },err=>console.error('reqs',err));
    refreshUsers().catch(e=>console.error(e));
  }else if(ME.role==='admin'){
    const q1=query(collection(db,'requests'));
    unsubReqs=onSnapshot(q1,snap=>{
      // الطلبات الملغاة تبقى خاصة بالموظف نفسه فقط، ولا تظهر عند الأدمن (سجلات/تقارير)
      CACHE_REQUESTS=sortByCreated(snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status!=='cancelled'));
      updateBadges(); if(['home','inbox','reports','audit','monthly'].includes(currentPage)) render();
    },err=>console.error('reqs',err));
    refreshUsers().catch(e=>console.error(e));
  }else{
    const q1=query(collection(db,'requests'),where('employeeUid','==',ME.id));
    unsubReqs=onSnapshot(q1,snap=>{
      CACHE_REQUESTS=sortByCreated(snap.docs.map(d=>({id:d.id,...d.data()})));
      updateBadges(); if(['home','mine'].includes(currentPage)) render();
    },err=>console.error('reqs',err));
  }
}
function updateBadges(){
  const box=$('#navLinks');
  if(isBoss()){
    const pending=CACHE_REQUESTS.filter(r=>r.status==='pending'&&canApprove(r)).length;
    const a=box.querySelector('a[data-page="inbox"]');
    if(a){a.querySelector('.badge')?.remove(); if(pending){a.appendChild(el('span','badge',pending));}}
  }
}

/* ---------- بطاقة حالة الطلب ---------- */
/* من يملك حق الموافقة: مدير النظام لكل الطلبات، ومدير القسم لطلبات قسمه فقط */
function canApprove(r){
  if(!ME) return false;
  if(ME.role==='admin') return true;
  if(ME.role==='manager') return !!r.department && r.department===ME.department && r.employeeUid!==ME.id;
  return false;
}
function isBoss(){ return ME && (ME.role==='admin'||ME.role==='manager'); }
function requestCard(r,forAdmin){
  const c=el('div','card');
  const isPerm=r.type==='permission';
  const head=el('div','',`
    <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap">
      <div>
        <div style="font-weight:800;color:var(--maroon);font-size:15.5px">
          ${isPerm?'استئذان':'إجازة'} — ${esc(r.categoryLabel)}
        </div>
        <div style="color:var(--muted);font-size:13px;margin-top:2px">
          ${forAdmin?esc(r.employeeName)+' · ':''}${esc(r.department||'')}
        </div>
      </div>
      <span class="pill ${r.status}">${STATUS_AR[r.status]}</span>
    </div>`);
  c.appendChild(head);
  const info=el('div','',`
    ${isPerm?`
      <div class="detail-line"><span class="k">التاريخ</span><span class="v">${fmtDate(r.date)}</span></div>
      <div class="detail-line"><span class="k">الوقت</span><span class="v">${esc(r.time||'—')}</span></div>
      <div class="detail-line"><span class="k">السبب</span><span class="v">${esc(r.reasonLabel||'—')}</span></div>
    `:`
      <div class="detail-line"><span class="k">من تاريخ</span><span class="v">${fmtDate(r.startDate)}</span></div>
      <div class="detail-line"><span class="k">إلى تاريخ</span><span class="v">${fmtDate(r.endDate)}</span></div>
      <div class="detail-line"><span class="k">عدد الأيام</span><span class="v">${r.days} يوم</span></div>
    `}
    <div class="detail-line"><span class="k">جهة الاعتماد</span><span class="v">${esc(r.approverName||'—')}</span></div>
    ${r.note?`<div class="detail-line"><span class="k">ملاحظات</span><span class="v">${esc(r.note)}</span></div>`:''}
    ${r.attachmentLink?`<div class="detail-line"><span class="k">مرفق</span><span class="v"><a href="${esc(r.attachmentLink)}" target="_blank" style="color:var(--maroon)">فتح الرابط ↗</a></span></div>`:''}
    <div class="detail-line"><span class="k">قُدّم في</span><span class="v">${fmtDT(r.createdAt)}</span></div>
    ${r.status==='rejected'&&r.rejectReason?`<div class="detail-line"><span class="k" style="color:var(--red)">سبب الرفض</span><span class="v" style="color:var(--red)">${esc(r.rejectReason)}</span></div>`:''}
    ${r.status!=='pending'?`<div class="detail-line"><span class="k">روجِع بواسطة</span><span class="v">${esc(r.reviewedBy||'—')} · ${fmtDT(r.reviewedAt)}</span></div>`:''}
  `);
  c.appendChild(info);
  // أزرار
  const bar=el('div','',''); bar.style.cssText='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap';
  const mayApprove = forAdmin && canApprove(r);
  if(mayApprove && r.status==='pending'){
    const ok=el('button','btn sm','✔ موافقة'); ok.onclick=()=>approve(r);
    const no=el('button','btn sm danger','✖ رفض'); no.onclick=()=>openReject(r);
    bar.append(ok,no); c.appendChild(bar);
  }
  if(mayApprove && r.status==='approved'){
    const revoke=el('button','btn sm danger','↩ إلغاء الموافقة'); revoke.onclick=()=>openRevoke(r);
    bar.append(revoke); c.appendChild(bar);
  }
  if(!forAdmin && r.status==='pending'){
    const cancel=el('button','btn sm ghost','إلغاء الطلب'); cancel.onclick=()=>withdraw(r);
    bar.append(cancel); c.appendChild(bar);
  }
  return c;
}

/* ---------- الموظف: الرئيسية (الحضور + ملخص) ---------- */
async function empHome(v,my){
  await pageAttend(v,my);   // الساعة الحية + مؤقّت الدوام + أزرار الحضور والانصراف
  if(my!==undefined && my!==renderSeq) return;   // عرض قديم — أوقف الإضافة لمنع التكرار

  // أرصدة الإجازات
  const bcard=el('div','card'); bcard.appendChild(el('h3','','🏖️ أرصدة الإجازات المتبقية'));
  const bg=el('div','grid cols-4');
  SETTINGS.leaveTypes.filter(t=>t.deduct).forEach(t=>{
    const bal=(ME.balances&&ME.balances[t.id]!=null)?ME.balances[t.id]:t.balance;
    bg.appendChild(stat(bal,t.label));
  });
  if(!bg.children.length) bg.appendChild(el('p','desc','لا توجد أرصدة معرّفة.'));
  bcard.appendChild(bg); v.appendChild(bcard);

  const quick=el('div','card');
  quick.appendChild(el('h3','','ابدأ بسرعة'));
  const b=el('button','btn','➕ تقديم طلب جديد'); b.style.width='auto'; b.onclick=()=>go('new');
  quick.appendChild(b); v.appendChild(quick);

  // آخر الطلبات
  const recent=ownRequests().slice(0,3);
  const rc=el('div','card'); rc.appendChild(el('h3','','آخر الطلبات'));
  if(!recent.length) rc.appendChild(el('div','empty','<div class="big">📭</div>لا توجد طلبات بعد'));
  else recent.forEach(r=>rc.appendChild(miniRow(r)));
  v.appendChild(rc);
}
function miniRow(r){
  const row=el('div','','');row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px';
  row.innerHTML=`<div><b>${r.type==='permission'?'استئذان':'إجازة'}</b> — ${esc(r.categoryLabel)}
    <div style="color:var(--muted);font-size:12.5px">${r.type==='permission'?fmtDate(r.date):fmtDate(r.startDate)+' ← '+fmtDate(r.endDate)}</div></div>
    <span class="pill ${r.status}">${STATUS_AR[r.status]}</span>`;
  return row;
}
function stat(n,l,cls=''){return el('div','stat '+cls,`<div class="n">${n}</div><div class="l">${l}</div>`);}

function pageNew(v){
  const card=el('div','card');
  const tabs=el('div','tabs',`<button class="active" data-t="permission">استئذان</button><button data-t="leave">إجازة</button>`);
  card.appendChild(tabs);
  const formHost=el('div',''); card.appendChild(formHost); v.appendChild(card);
  let type='permission';
  const renderForm=()=>{ formHost.innerHTML=''; formHost.appendChild(type==='permission'?permForm():leaveForm()); };
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); type=b.dataset.t; renderForm();
  });

function approverOptions(){return SETTINGS.approvers.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');}

function permForm(){
  const f=el('div','');
  f.innerHTML=`
    <div class="form-row">
      <div class="field"><label>نوع الاستئذان</label>
        <select id="pfCat"><option value="تأخير عن الدوام">تأخير عن الدوام</option><option value="خروج مبكر">خروج مبكر</option></select></div>
      <div class="field"><label>السبب</label>

    </div>
    <div class="form-row">
      <div class="field"><label>التاريخ</label><input id="pfDate" type="date"></div>
      <div class="field"><label>الوقت</label><input id="pfTime" type="time"></div>
    </div>
    <div class="form-row one">
      <div class="field"><label>جهة الاعتماد (المُستأذَن منه)</label><select id="pfApprover">${approverOptions()}</select></div>
    </div>
    <div class="form-row one"><div class="field"><label>ملاحظات (اختياري)</label><textarea id="pfNote" placeholder="تفاصيل إضافية…"></textarea></div></div>
    <button class="btn" id="pfSubmit" style="width:auto">تقديم طلب الاستئذان</button>`;
  f.querySelector('#pfSubmit').onclick=async()=>{
    const cat=f.querySelector('#pfCat').value, date=f.querySelector('#pfDate').value,
      time=f.querySelector('#pfTime').value, rId=f.querySelector('#pfReason').value,
      aId=f.querySelector('#pfApprover').value, note=f.querySelector('#pfNote').value.trim();
    if(!date||!time){toast('أدخل التاريخ والوقت','err');return;}
    if(!rId){toast('اختر السبب','err');return;} if(!aId){toast('اختر جهة الاعتماد','err');return;}
    const reason=SETTINGS.permissionReasons.find(x=>x.id===rId);
    const appr=SETTINGS.approvers.find(x=>x.id===aId);
    await submitRequest({type:'permission',category:cat,categoryLabel:cat,date,time,
      reasonId:rId,reasonLabel:reason?.label||'',approverId:aId,approverName:appr?.name||'',note});
  };
  return f;
}
function leaveForm(){
  const f=el('div','');
  f.innerHTML=`
    <div class="form-row">
      <div class="field"><label>نوع الإجازة</label>
        <select id="lfType">${SETTINGS.leaveTypes.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('')}</select></div>
      <div class="field"><label>جهة الاعتماد</label><select id="lfApprover">${approverOptions()}</select></div>
    </div>
    <div class="form-row">
      <div class="field"><label>من تاريخ</label><input id="lfStart" type="date"></div>
      <div class="field"><label>إلى تاريخ</label><input id="lfEnd" type="date"></div>
    </div>
    <div class="help" id="lfDays"></div>
    <div class="form-row one"><div class="field"><label>رابط مرفق (اختياري — مثل تقرير طبي على Google Drive)</label><input id="lfAtt" type="url" placeholder="https://…"></div></div>
    <div class="form-row one"><div class="field"><label>ملاحظات (اختياري)</label><textarea id="lfNote"></textarea></div></div>
    <button class="btn" id="lfSubmit" style="width:auto;margin-top:6px">تقديم طلب الإجازة</button>`;
  const upd=()=>{const s=f.querySelector('#lfStart').value,e=f.querySelector('#lfEnd').value;
    if(!s||!e){f.querySelector('#lfDays').textContent='';return;}
    const w=workingDaysBetween(s,e);
    f.querySelector('#lfDays').textContent=`المدة: ${w.days} يوم عمل`+(w.off?` (تم استثناء ${w.off} يوم راحة)`:'');};
  f.querySelector('#lfStart').onchange=upd; f.querySelector('#lfEnd').onchange=upd;
  f.querySelector('#lfSubmit').onclick=async()=>{
    const tId=f.querySelector('#lfType').value,s=f.querySelector('#lfStart').value,
      e=f.querySelector('#lfEnd').value,aId=f.querySelector('#lfApprover').value,
      att=f.querySelector('#lfAtt').value.trim(),note=f.querySelector('#lfNote').value.trim();
    if(!s||!e){toast('أدخل تاريخ البداية والنهاية','err');return;}
    if(new Date(e)<new Date(s)){toast('تاريخ النهاية قبل البداية','err');return;}
    if(!aId){toast('اختر جهة الاعتماد','err');return;}
    const t=SETTINGS.leaveTypes.find(x=>x.id===tId);
    const appr=SETTINGS.approvers.find(x=>x.id===aId);
    const wd=workingDaysBetween(s,e);
    if(!wd.days){toast('المدة المختارة كلها أيام راحة','err');return;}
    await submitRequest({type:'leave',category:tId,categoryLabel:t?.label||'',
      startDate:s,endDate:e,days:wd.days,approverId:aId,approverName:appr?.name||'',
      note,attachmentLink:att,leaveTypeId:tId,deduct:t?.deduct??false});
  };
  return f;
}

async function submitRequest(data){
  try{
    await addDoc(collection(db,'requests'),{
      ...data, employeeUid:ME.id, employeeName:ME.name, employeeEmpId:ME.empId||'',
      department:ME.department||'', status:'pending', rejectReason:'',
      reviewedBy:'', reviewedAt:null, createdAt:serverTimestamp()
    });
    toast('تم تقديم الطلب بنجاح','ok'); go('mine');
  }catch(e){console.error(e);toast('تعذّر تقديم الطلب','err');}
}

/* طلبات المستخدم نفسه (مدير القسم يرى طلبات قسمه في الكاش، فنفصلها هنا) */

/* ---------- الموظف: طلباتي ---------- */

  const MY=ownRequests();
  if(!MY.length){v.appendChild(el('div','card','<div class="empty"><div class="big">📭</div>لا توجد طلبات — ابدأ بتقديم طلب جديد</div>'));return;}
  const filt=el('div','filters');
  filt.innerHTML=`<div class="field"><label>الحالة</label><select id="fStatus">
    <option value="">الكل</option><option value="pending">تحت المراجعة</option>
    <option value="approved">تمت الموافقة</option><option value="rejected">مرفوض</option>
    <option value="cancelled">ملغي</option></select></div>
    <div class="field"><label>النوع</label><select id="fType"><option value="">الكل</option>
    <option value="permission">استئذان</option><option value="leave">إجازة</option></select></div>`;
  v.appendChild(filt);
  const host=el('div',''); v.appendChild(host);
  const draw=()=>{host.innerHTML='';
    const st=filt.querySelector('#fStatus').value,ty=filt.querySelector('#fType').value;
    const list=MY.filter(r=>(!st||r.status===st)&&(!ty||r.type===ty));

    list.forEach(r=>host.appendChild(requestCard(r,false)));};
  filt.querySelector('#fStatus').onchange=draw; filt.querySelector('#fType').onchange=draw; draw();
}

  v.appendChild(g);

  const g2=el('div','grid cols-2');
  g2.append(stat(inCyc.filter(r=>r.type==='permission').length,'استئذانات الدورة'),
            stat(inCyc.filter(r=>r.type==='leave').length,'إجازات الدورة'));
  v.appendChild(g2);

  const rc=el('div','card');
  const rcHead=el('div','');rcHead.style.cssText='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px';
  rcHead.appendChild(el('h3','','📅 تقرير هذه الدورة'));
  const expBtn=el('button','btn sm','⬇️ تصدير Excel');expBtn.onclick=()=>monthlyExport(cyc);
  rcHead.appendChild(expBtn);rc.appendChild(rcHead);
  rc.appendChild(el('p','desc','للاطلاع على كل الدورات السابقة وتصديرها، افتح «التقارير الشهرية».'));
  v.appendChild(rc);

  const pc=el('div','card'); pc.appendChild(el('h3','','📥 طلبات تنتظر مراجعتك'));

  else{ waiting.slice(0,5).forEach(r=>pc.appendChild(requestCard(r,true)));

  v.appendChild(pc);

async function approve(r){
  try{
    await updateDoc(doc(db,'requests',r.id),{status:'approved',reviewedBy:ME.name,reviewedAt:serverTimestamp(),rejectReason:''});
    // خصم رصيد الإجازة عند الموافقة — بـ transaction حتى لا يضيع خصم عند موافقتين متتاليتين
    if(r.type==='leave' && r.deduct && r.leaveTypeId) await adjustBalance(r,-1);
    await logAction('موافقة على طلب',`${r.type==='permission'?'استئذان':'إجازة'} — ${r.employeeName}`);
    toast('تمت الموافقة على الطلب','ok');
  }catch(e){console.error(e);toast('تعذّر تنفيذ الموافقة','err');}
}
/* تعديل رصيد الإجازة ذرّياً. sign=-1 خصم، sign=+1 إعادة */
async function adjustBalance(r,sign){
  const uref=doc(db,'users',r.employeeUid);
  const t=SETTINGS.leaveTypes.find(x=>x.id===r.leaveTypeId);
  await runTransaction(db,async(tx)=>{
    const snap=await tx.get(uref);
    if(!snap.exists()) return;
    const bal={...(snap.data().balances||{})};
    const cur=(bal[r.leaveTypeId]!=null)?bal[r.leaveTypeId]:(t?t.balance:0);
    bal[r.leaveTypeId]=Math.max(0,cur+sign*(r.days||0));   /* لا يصير الرصيد سالباً */
    tx.update(uref,{balances:bal});
  });
}

async function revokeApproval(r,reason){

  await logAction('إلغاء موافقة',`${r.type==='permission'?'استئذان':'إجازة'} — ${r.employeeName} — ${reason}`);

/* عدد الأيام المتبقية للعقد + تلوين تحذيري */
function contractDaysLeft(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+'T00:00:00'); if(isNaN(d)) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function contractCell(dateStr){
  const n=contractDaysLeft(dateStr);
  if(n===null) return '—';
  if(n<0)  return `<span class="pill rejected">منتهي (${-n} يوم)</span>`;
  if(n<=60)return `<span class="pill pending">${dateStr} · ${n} يوم</span>`;
  return `<span style="color:var(--muted)">${dateStr}</span>`;
}

/* ---------- استعادة الوصول (كلمة مرور افتراضية 123456) ---------- */
function openRestoreAccess(u){
  const ov=el('div','overlay');
  const m=el('div','modal',`<h3>استعادة الوصول — ${esc(u.name)}</h3>
    <div class="help">
      الخطوة ١: روح لـ Firebase → Authentication → Users، دوّر عن حساب هذا الموظف (بريده الداخلي <b>${esc(u.email||'')}</b>) واحذفه من هناك.<br><br>
      الخطوة ٢: بعد ما تحذفه من Firebase، اضغط الزر تحت — بينشئ حساب دخول جديد بنفس رقم الجوال وكلمة مرور مبدئية <b>123456</b>، وينقل كل بيانات الموظف وسجل طلباته للحساب الجديد تلقائياً بدون ما يضيع شي.
    </div>
    <div class="err" id="raErr"></div>
    <div class="row"><button class="btn ghost" id="raCancel">إلغاء</button><button class="btn" id="raOk">تم الحذف — إنشاء حساب جديد</button></div>`);
  ov.appendChild(m);document.body.appendChild(ov);
  m.querySelector('#raCancel').onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  m.querySelector('#raOk').onclick=async()=>{
    const btn=m.querySelector('#raOk');btn.disabled=true;btn.textContent='جارٍ الاستعادة…';
    try{ await restoreAccess(u); ov.remove(); }
    catch(e){
      console.error(e);
      const map={'auth/email-already-in-use':'الحساب لسه موجود في Authentication — تأكد إنك حذفته أولاً'};
      m.querySelector('#raErr').textContent=map[e.code]||'تعذّرت الاستعادة';
      btn.disabled=false;btn.textContent='تم الحذف — إنشاء حساب جديد';
    }
  };
}
async function restoreAccess(u){
  const phoneDigits=normPhone(u.phone);
  const email=phoneDigits?phoneDigits+'@seen-hr.local':u.email;
  const oldUid=u.id;
  // إنشاء حساب جديد عبر تطبيق ثانوي حتى لا يُسجّل خروج الأدمن
  const secondary=initializeApp(firebaseConfig,'secondary_'+Date.now());
  const secAuth=getAuth(secondary);
  const cred=await createUserWithEmailAndPassword(secAuth,email,'123456');
  const newUid=cred.user.uid;
  await signOut(secAuth);
  // نسخ بيانات الموظف كاملة لملف جديد مرتبط بالحساب الجديد
  const {id,...data}=u;
  await setDoc(doc(db,'users',newUid),{...data,email,mustChangePassword:true});
  // نقل كل طلباته القديمة للحساب الجديد حتى لا تضيع
  const snap=await getDocs(query(collection(db,'requests'),where('employeeUid','==',oldUid)));
  for(const d of snap.docs){ await updateDoc(doc(db,'requests',d.id),{employeeUid:newUid}); }
  // حذف الملف القديم بعد اكتمال النقل
  await deleteDoc(doc(db,'users',oldUid));
  await logAction('استعادة وصول موظف',u.name+' — كلمة مرور افتراضية 123456');
  await refreshUsers(); render();
  toast('تم إنشاء حساب جديد بكلمة مرور 123456 ونُقلت كل بياناته','ok');
}

        <div class="help">قيمة الساعة = قيمة اليوم ÷ هذا الرقم</div></div>
    </div>
    <div class="form-row">
      <div class="field"><label>سماح التأخير (دقيقة) — لا يُخصم</label><input id="pcGrace" type="number" min="0" max="120" value="${pc.graceMinutes||0}"></div>
      <div class="field" style="display:flex;align-items:flex-end"><div class="help" id="pcPreview"></div></div>
    </div>`;
  payCard.appendChild(payBody);
  const payPrev=()=>{
    const d=Number(payBody.querySelector('#pcDays').value)||30, h=Number(payBody.querySelector('#pcHours').value)||8;
    payBody.querySelector('#pcPreview').innerHTML=`مثال: راتب <b>6,000</b> → قيمة اليوم <b>${money(6000/d)}</b> · قيمة الساعة <b>${money(6000/d/h)}</b>`;

      daysPerMonth:Number(payBody.querySelector('#pcDays').value)||30,
      hoursPerDay:Number(payBody.querySelector('#pcHours').value)||8,
      graceMinutes:Number(payBody.querySelector('#pcGrace').value)||0
    };
    await saveSettings(); toast('حُفظت إعدادات الرواتب','ok');
  };
  payCard.appendChild(paySave); v.appendChild(payCard);

  refreshUsers().then(()=>{drawDeps();}).catch(()=>drawDeps());
  drawEx();
}

function chipCard(title,ic,key,fields,labels,renderItem,build){
  const card=el('div','card');card.appendChild(el('h3','',`${ic} ${title}`));
  const chips=el('div','chips');card.appendChild(chips);
  const draw=()=>{chips.innerHTML='';
    (SETTINGS[key]||[]).forEach(item=>{
      const c=el('span','chip',renderItem(item));
      const x=el('button','','×');x.onclick=async()=>{SETTINGS[key]=SETTINGS[key].filter(z=>z.id!==item.id);await saveSettings();draw();};
      c.appendChild(x);chips.appendChild(c);});
    if(!(SETTINGS[key]||[]).length)chips.appendChild(el('span','desc','لا توجد عناصر.'));};
  draw();
  const add=el('div','add-inline');
  add.innerHTML=fields.map((f,i)=>`<div class="field"><label>${labels[i]}</label><input id="add_${key}_${f}"></div>`).join('');
  const btn=el('button','btn sm','إضافة');
  btn.onclick=async()=>{const vals={};let ok=true;

/* ---------- الأدمن: التقارير الشهرية (26 → 25) ---------- */
function pageMonthly(v){
  const cur=cycleOf(new Date());
  const map=new Map(); map.set(cur.key,cur);
  CACHE_REQUESTS.forEach(r=>{const c=cycleOf(reqEventDate(r));map.set(c.key,c);});
  const cycles=[...map.values()].sort((a,b)=>b.start-a.start);

  const sel=el('div','card');
  sel.appendChild(el('h3','','📅 اختر الدورة الشهرية'));
  sel.appendChild(el('p','desc','كل دورة تبدأ يوم 26 وتنتهي يوم 25 من الشهر التالي. تُصنَّف الطلبات حسب تاريخ الاستئذان/بداية الإجازة.'));
  const dd=el('select','');dd.style.cssText='width:100%;max-width:360px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px';
  dd.innerHTML=cycles.map(c=>`<option value="${c.key}">${c.label}${c.key===cur.key?' (الحالية)':''}</option>`).join('');
  sel.appendChild(dd);v.appendChild(sel);

  const host=el('div','');v.appendChild(host);
  const draw=()=>{
    host.innerHTML='';
    const cyc=cycles.find(c=>c.key===dd.value)||cur;
    const list=requestsInCycle(cyc);
    const perms=list.filter(r=>r.type==='permission');
    const leaves=list.filter(r=>r.type==='leave');
    const approvedDays=leaves.filter(r=>r.status==='approved').reduce((s,r)=>s+(r.days||0),0);

    const g=el('div','grid cols-4');
    g.append(stat(list.length,'إجمالي الطلبات'),stat(perms.length,'استئذانات'),
             stat(leaves.length,'إجازات'),stat(approvedDays,'أيام إجازة معتمدة','g'));
    host.appendChild(g);
    const g2=el('div','grid cols-3');
    g2.append(stat(list.filter(r=>r.status==='approved').length,'موافق عليها','g'),
              stat(list.filter(r=>r.status==='rejected').length,'مرفوضة','r'),
              stat(list.filter(r=>r.status==='pending').length,'تحت المراجعة','a'));
    host.appendChild(g2);

    const card=el('div','card');
    const head=el('div','');head.style.cssText='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px';
    head.appendChild(el('h3','',`تفاصيل الدورة — ${cyc.label}`));
    const exp=el('button','btn sm','⬇️ تصدير Excel');exp.onclick=()=>monthlyExport(cyc);
    const clr=el('button','btn sm danger','🗑️ مسح بيانات الدورة');clr.onclick=()=>clearCycle(cyc,list);
    head.appendChild(exp);head.appendChild(clr);card.appendChild(head);

    if(!list.length) card.appendChild(el('div','empty','<div class="big">📭</div>لا توجد طلبات في هذه الدورة'));
    else{
      const wrap=el('div','table-wrap');
      wrap.innerHTML=`<table><thead><tr><th>الموظف</th><th>النوع</th><th>التصنيف</th><th>التاريخ</th><th>الأيام</th><th>الحالة</th></tr></thead>
        <tbody>${list.map(r=>`<tr>
          <td><b>${esc(r.employeeName)}</b></td>
          <td>${r.type==='permission'?'استئذان':'إجازة'}</td>
          <td>${esc(r.categoryLabel)}</td>
          <td>${r.type==='permission'?fmtDate(r.date):fmtDate(r.startDate)+' ← '+fmtDate(r.endDate)}</td>
          <td>${r.type==='leave'?r.days:'—'}</td>
          <td><span class="pill ${r.status}">${STATUS_AR[r.status]}</span></td></tr>`).join('')}</tbody></table>`;
      card.appendChild(wrap);
    }
    host.appendChild(card);
  };
  dd.onchange=draw;draw();
}

async function clearCycle(cyc,list){
  if(!list.length){toast('لا توجد بيانات لمسحها في هذه الدورة','err');return;}
  if(!confirm(`سيتم حذف ${list.length} طلب نهائياً من دورة «${cyc.label}» ولا يمكن التراجع عن هذا الإجراء. متابعة؟`))return;
  if(!confirm('تأكيد أخير: هذا حذف نهائي لكل طلبات هذي الدورة (استئذانات وإجازات). متأكد؟'))return;
  try{
    for(const r of list){ await deleteDoc(doc(db,'requests',r.id)); }
    await logAction('مسح بيانات دورة',cyc.label+' — '+list.length+' طلب');
    toast('تم مسح بيانات الدورة وتصفير العداد','ok');
  }catch(e){console.error(e);toast('تعذّر إكمال المسح لكل الطلبات','err');}
}
async function monthlyExport(cyc){
  const list=requestsInCycle(cyc);
  let att=[],attDev=[];
  try{ att=await fetchAttendance(cyc,'attendance'); }catch(e){ console.error(e); }
  try{ attDev=await fetchAttendance(cyc,'zkAttendance'); }catch(e){ console.error(e); }
  if(!list.length && !att.length && !attDev.length){toast('لا توجد بيانات في هذه الدورة','err');return;}
  const perms=list.filter(r=>r.type==='permission');
  const leaves=list.filter(r=>r.type==='leave');

  const summary=[
    {'البند':'الدورة','القيمة':cyc.label},
    {'البند':'من تاريخ','القيمة':fmtDate(cyc.start)},
    {'البند':'إلى تاريخ','القيمة':fmtDate(cyc.end)},
    {'البند':'إجمالي الطلبات','القيمة':list.length},
    {'البند':'عدد الاستئذانات','القيمة':perms.length},
    {'البند':'عدد الإجازات','القيمة':leaves.length},
    {'البند':'موافق عليها','القيمة':list.filter(r=>r.status==='approved').length},
    {'البند':'مرفوضة','القيمة':list.filter(r=>r.status==='rejected').length},
    {'البند':'تحت المراجعة','القيمة':list.filter(r=>r.status==='pending').length},
    {'البند':'أيام الإجازات المعتمدة','القيمة':leaves.filter(r=>r.status==='approved').reduce((s,r)=>s+(r.days||0),0)},
    {'البند':'تاريخ التقرير','القيمة':fmtDate(new Date())},
  ];
  const permRows=perms.map(r=>({
    'الموظف':r.employeeName,'الرقم الوظيفي':r.employeeEmpId||'','القسم':r.department||'',
    'نوع الاستئذان':r.categoryLabel,'التاريخ':r.date,'الوقت':r.time,'السبب':r.reasonLabel||'',
    'جهة الاعتماد':r.approverName||'','الحالة':STATUS_AR[r.status],'سبب الرفض':r.rejectReason||'','روجع بواسطة':r.reviewedBy||''
  }));
  const leaveRows=leaves.map(r=>({
    'الموظف':r.employeeName,'الرقم الوظيفي':r.employeeEmpId||'','القسم':r.department||'',
    'نوع الإجازة':r.categoryLabel,'من':r.startDate,'إلى':r.endDate,'عدد الأيام':r.days,
    'جهة الاعتماد':r.approverName||'','الحالة':STATUS_AR[r.status],'سبب الرفض':r.rejectReason||'','روجع بواسطة':r.reviewedBy||''
  }));

  const mapSess=(rows)=>rows.map(row=>{const s=row.s||{};let hours='';if(s.in&&s.out)hours=((tsToDate(s.out)-tsToDate(s.in))/3600000).toFixed(2);
    return {'الموظف':row.r.employeeName,'الرقم الوظيفي':row.r.employeeEmpId||'','القسم':row.r.department||'',
      'التاريخ':row.r.date,'اليوم':AR_DAYS[row.r.dow]||'','الوردية':row.r.shiftLabel||'','الجلسة':row.idx+1,
      'وقت الحضور':hm(s.in),'وقت الانصراف':hm(s.out),'ساعات العمل':hours};
  });
  const attRows=mapSess(flattenSessions(att));
  const devRows=mapSess(flattenSessions(attDev));

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'ملخص الدورة');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(permRows.length?permRows:[{'لا يوجد':''}]),'الاستئذانات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(leaveRows.length?leaveRows:[{'لا يوجد':''}]),'الإجازات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attRows.length?attRows:[{'لا يوجد':''}]),'حضور الموقع');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(devRows.length?devRows:[{'لا يوجد':''}]),'بصمات الجهاز');
  XLSX.writeFile(wb,`تقرير_سين_${cyc.key}.xlsx`);
  toast('تم تصدير التقرير الشهري','ok');
}

    const tickOnly=()=>{const t=new Date();clockEl.textContent=`${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())}`;};
    tickOnly(); if(uiTimer)clearInterval(uiTimer); uiTimer=setInterval(tickOnly,1000);
    return;
  }

  const card=el('div','card');
  const statusBox=el('div','','<div class="empty"><span class="spinner"></span> جارٍ تحميل حالتك…</div>');
  card.appendChild(statusBox);

  /* ✅ زر واحد فقط: يتحوّل تلقائياً بين حضور وانصراف */
  const actBtn=el('button','btn','…');
  actBtn.style.cssText='padding:18px;font-size:17px;border-radius:14px;margin-top:6px';
  actBtn.disabled=true;
  card.appendChild(actBtn);

  card.appendChild(el('p','help',
    `سيُطلب إذن الموقع والتحقق بالبصمة/Face ID. يجب أن تكون داخل نطاق ${company.radius||500} متر من الشركة.`));
  card.appendChild(el('p','help',
    '🔒 جلستك تبقى مفتوحة حتى تضغط «تسجيل انصراف» بنفسك — إغلاق الصفحة أو قفل الجوال أو انقطاع الإنترنت لا يسجّل انصراف.'));
  v.appendChild(card);

  const ref=doc(db,'attendance',ME.id+'_'+dateStr);
  let todayDoc=null, loaded=false, loadErr=false, busy=false;

  const isOpen=()=>sessionsOf(todayDoc).some(s=>!s.out);

  function paintTimer(){
    const ss=sessionsOf(todayDoc);
    if(!ss.length){timerEl.className='work-timer';timerEl.innerHTML='<span class="wt-idle">لم تُسجّل الحضور بعد</span>';return;}
    const {secs,open}=workedSecs(ss);
    if(open){ timerEl.className='work-timer live'; timerEl.innerHTML=`<span class="wt-label">داخل العمل</span><span class="wt-val">${fmtDur(secs)}</span>`; }
    else{ timerEl.className='work-timer done'; timerEl.innerHTML=`<span class="wt-label">خارج العمل — مجموع اليوم</span><span class="wt-val">${fmtDur(secs)}</span>`; }
  }

  function paintBtn(){
    if(busy) return;
    if(!loaded){ actBtn.disabled=true; actBtn.className='btn'; actBtn.textContent='… جارٍ التحميل'; return; }
    if(loadErr){ actBtn.disabled=true; actBtn.className='btn'; actBtn.textContent='⚠️ تعذّر قراءة حالتك — حدّث الصفحة'; return; }
    if(isOpen()){ actBtn.disabled=false; actBtn.className='btn danger'; actBtn.textContent='🔴 تسجيل انصراف'; return; }
    if(shiftEndPassed()){ actBtn.disabled=true; actBtn.className='btn'; actBtn.textContent='⛔ انتهى وقت الدوام'; return; }
    actBtn.disabled=false; actBtn.className='btn'; actBtn.textContent='🟢 تسجيل حضور';
  }

  function paintStatus(){
    if(loadErr){
      statusBox.innerHTML='<div class="empty" style="color:var(--red)">⚠️ تعذّر قراءة سجل اليوم. لم يتغيّر شيء — حدّث الصفحة وحاول مرة ثانية.</div>';
      return;
    }
    const ss=sessionsOf(todayDoc);
    const open=isOpen();
    const first=ss[0], last=ss[ss.length-1];
    statusBox.innerHTML=`
      <div class="detail-line"><span class="k">الحالة الآن</span><span class="v" style="color:${open?'var(--green)':'var(--muted)'}">${open?'🟢 داخل العمل':(ss.length?'خارج العمل':'لم تُسجّل بعد')}</span></div>
      <div class="detail-line"><span class="k">عدد جلسات اليوم</span><span class="v">${ss.length}</span></div>
      <div class="detail-line"><span class="k">أول حضور</span><span class="v" style="color:var(--green)">${first?hm(first.in):'—'}</span></div>
      <div class="detail-line"><span class="k">آخر انصراف</span><span class="v" style="color:var(--red)">${(last&&last.out)?hm(last.out):'—'}</span></div>`;
  }

  function paintAll(){ paintStatus(); paintTimer(); paintBtn(); }

  function tick(){
    const t=new Date();
    clockEl.textContent=`${p2(t.getHours())}:${p2(t.getMinutes())}:${p2(t.getSeconds())}`;
    paintTimer(); paintBtn();
  }

  /* اشتراك لحظي: الحالة تُستعاد صحيحة عند إعادة فتح الصفحة أو الجوال،
     ولا يُفترض أبداً أن غياب البيانات = عدم وجود جلسة مفتوحة. */
  if(unsubAtt){unsubAtt();unsubAtt=null;}
  unsubAtt = onSnapshot(ref,
    snap=>{ todayDoc = snap.exists()?snap.data():null; loaded=true; loadErr=false; paintAll(); },
    err=>{ console.error('att',err); loaded=true; loadErr=true; paintAll(); });

  actBtn.onclick=async()=>{
    if(!loaded||loadErr||busy) return;
    await doAttendance(isOpen()?'out':'in', ref, actBtn, b=>{busy=b; if(!b) paintAll();});
  };

  if(my!==undefined && my!==renderSeq) return;
  tick(); if(uiTimer)clearInterval(uiTimer); uiTimer=setInterval(tick,1000);
}

async function doAttendance(kind,ref,btn,setBusy){
  const company=SETTINGS.company||{};
  setBusy(true); btn.disabled=true;
  const fail=(msg)=>{ toast(msg,'err'); setBusy(false); };

  if(kind==='in' && shiftEndPassed()) return fail('انتهى وقت الدوام الرسمي — لا يمكن تسجيل الحضور');

  /* قراءة الحالة الحقيقية من السيرفر قبل أي كتابة (بدون تخمين) */
  let pre;
  btn.textContent='🔄 تحقّق من حالتك…';
  try{ const snap=await getDoc(ref); pre=snap.exists()?snap.data():null; }
  catch(e){ console.error(e); return fail('تعذّر قراءة سجل اليوم — تحقّق من الإنترنت'); }
  const preSessions=sessionsOf(pre).map(x=>({...x}));
  const openIdx=(()=>{ for(let i=preSessions.length-1;i>=0;i--) if(!preSessions[i].out) return i; return -1; })();
  if(kind==='in'  && openIdx>=0) return fail('أنت مسجّل دخول بالفعل — سجّل الانصراف أولاً');
  if(kind==='out' && openIdx<0)  return fail('لست مسجّل دخول حالياً');

  btn.textContent='📍 تحديد الموقع…';
  let pos;
  try{ pos=await getPosition(); }
  catch(e){ return fail(e.code===1?'رفضت إذن الموقع — لا يمكن التسجيل':'تعذّر تحديد موقعك'); }
  if(pos.acc && pos.acc>1000) return fail(`دقة الموقع ضعيفة (±${Math.round(pos.acc)} م) — شغّل GPS واقترب من نافذة`);
  const dist=haversine(pos,{lat:company.lat,lng:company.lng});
  if(dist>(company.radius||500)) return fail(`أنت خارج نطاق الشركة (${Math.round(dist)} م). اقترب من الموقع.`);

  let usedBio=false;
  if(await bioSupported()){
    btn.textContent='👆 تحقّق بالبصمة…';
    try{ usedBio = !!(await verifyBiometric()); }
    catch(e){
      if(e.name==='NotAllowedError') return fail('أُلغي التحقق بالبصمة');
      usedBio=false;
    }
  }

  btn.textContent='💾 جارٍ الحفظ…';
  try{
    const now=new Date(), dow=now.getDay();
    if(kind==='in'){
      const sessions=preSessions.concat([{
        in:now, out:null, inLoc:{lat:pos.lat,lng:pos.lng},
        inAcc:Math.round(pos.acc||0), inDist:Math.round(dist), inBio:usedBio, source:'web'
      }]);
      await setDoc(ref,{
        employeeUid:ME.id, employeeName:ME.name, employeeEmpId:ME.empId||'',
        department:ME.department||'', date:ymd(now), dow,
        shiftLabel:shiftLabelOf(dow), source:'web', sessions
      },{merge:true});
      toast('تم تسجيل الحضور','ok');
    }else{
      const sessions=preSessions;
      sessions[openIdx]={...sessions[openIdx],
        out:now, outLoc:{lat:pos.lat,lng:pos.lng},
        outAcc:Math.round(pos.acc||0), outDist:Math.round(dist), outBio:usedBio};
      await setDoc(ref,{sessions},{merge:true});
      toast('تم تسجيل الانصراف','ok');
    }
  }catch(e){
    console.error(e);
    return fail(e.code==='permission-denied'
      ? 'رُفض الحفظ — تأكد أن ساعة جهازك مضبوطة على الوقت الصحيح'
      : 'تعذّر الحفظ — تحقّق من الإنترنت');
  }
  setBusy(false);
}

/* ---------- الأدمن: سجل الحضور ---------- */
function recentCyclesList(n=12){const arr=[];let d=new Date();for(let i=0;i<n;i++){const c=cycleOf(d);arr.push(c);d=new Date(c.start);d.setDate(d.getDate()-1);}return arr;}
function flattenSessions(recs){
  const rows=[];
  recs.forEach(r=>{const ss=sessionsOf(r); if(!ss.length){rows.push({r,idx:0,s:null});return;} ss.forEach((s,i)=>rows.push({r,idx:i,s}));});
  rows.sort((a,b)=>(a.r.employeeName||'').localeCompare(b.r.employeeName||'')||(a.r.date>b.r.date?1:-1)||a.idx-b.idx);
  return rows;
}
/* ===== التكامل: حساب الحالة اليومية (حاضر/متأخر/غائب/إجازة) مع ربط الاستئذان ===== */
const LATE_GRACE_MIN=15;
function hmToDate(base,hhmm){if(!hhmm)return null;const [h,m]=hhmm.split(':').map(Number);const x=new Date(base);x.setHours(h,m,0,0);return x;}
function lastOutOf(sessions){for(let i=sessions.length-1;i>=0;i--){if(sessions[i].out)return tsToDate(sessions[i].out);}return null;}
function buildDailyStatus(cyc,users,requests,recs){
  const recMap={}; recs.forEach(r=>{recMap[r.employeeUid+'_'+r.date]=r;});
  const emps=users.filter(u=>u.role!=='admin');
  const now=new Date();
  const end=(cyc.end<now)?cyc.end:now;
  const rows=[];
  emps.forEach(u=>{
    for(let d=new Date(cyc.start); d<=end; d.setDate(d.getDate()+1)){
      const dateStr=ymd(d), dow=d.getDay();
      const shift=resolveShift(dateStr,dow,u.department);
      if(!shift||shift.type==='off') continue;   /* راحة أو عطلة رسمية → لا يُحاسب عليها */
      const leave=requests.find(r=>r.type==='leave'&&r.status==='approved'&&r.employeeUid===u.id&&r.startDate<=dateStr&&r.endDate>=dateStr);
      const perms=requests.filter(r=>r.type==='permission'&&r.status==='approved'&&r.employeeUid===u.id&&r.date===dateStr);
      const latePerm=perms.find(p=>(p.category||'').includes('تأخير'));
      const earlyPerm=perms.find(p=>(p.category||'').includes('خروج'));
      const rec=recMap[u.id+'_'+dateStr];
      const sessions=sessionsOf(rec);
      const firstIn=sessions.length?tsToDate(sessions[0].in):null;
      const lastOut=lastOutOf(sessions);
      const openSess=sessions.some(s=>!s.out);
      const {secs}=workedSecs(sessions);
      const win=shiftWindowFor(d,shift);
      let status,cls,note='',lateMin=0;
      if(leave){ status='إجازة: '+(leave.categoryLabel||''); cls='leave'; }
      else if(firstIn){
        /* نسيان بصمة الخروج: جلسة مفتوحة ومضى أكثر من ساعتين على نهاية الوردية */
        if(openSess && win && now>new Date(win.end.getTime()+MISSING_OUT_AFTER_MIN*60000)){
          status='نسيان بصمة الخروج'; cls='missing';
          note=`دخل ${hm(firstIn)} ولم يسجّل انصراف — مضى أكثر من ساعتين على نهاية الوردية`;
        } else {
          const allowedStr=(latePerm&&latePerm.time)?latePerm.time:(shift.start||'');
          const allowedBase=hmToDate(d,allowedStr);
          if(allowedBase){
            const grace=new Date(allowedBase.getTime()+LATE_GRACE_MIN*60000);
            if(firstIn>grace){ lateMin=Math.round((firstIn-allowedBase)/60000); status='متأخر'; cls='late'; note=`تأخر ${lateMin} د`; }
            else { status='حاضر'; cls='present'; }
          } else { status='حاضر'; cls='present'; }
        }
        if(latePerm)  note=(note?note+' · ':'')+`استئذان تأخير حتى ${latePerm.time||''}`;
        if(earlyPerm) note=(note?note+' · ':'')+`استئذان خروج مبكر ${earlyPerm.time||''}`;
      } else {
        status='غائب'; cls='absent';
        if(latePerm)       note=`استئذان تأخير حتى ${latePerm.time||''}`;
        else if(earlyPerm) note=`استئذان خروج مبكر ${earlyPerm.time||''}`;
      }
      if(shift.src==='exception'&&shift.exLabel) note=(note?note+' · ':'')+shift.exLabel;
      else if(shift.src==='dept')                note=(note?note+' · ':'')+'وردية القسم';
      rows.push({u,dateStr,dow,shift,status,cls,note,firstIn,lastOut,secs,rec,openSess,lateMin});
    }
  });
  rows.sort((a,b)=>(a.u.name||'').localeCompare(b.u.name||'')||(a.dateStr>b.dateStr?1:-1));
  return rows;
}

/* ═══════════════════════════════════════════════════════════════════
   مسير الرواتب — قواعد الحساب المعتمدة:
     • قيمة اليوم   = الراتب ÷ 30
     • قيمة الساعة  = قيمة اليوم ÷ 8   (قابلة للتعديل من الإعدادات)
     • الخصم        = (دقائق التأخير + دقائق الخروج المبكر) × قيمة الساعة
     • الغياب       = خصم يوم كامل
     • إجازة مدفوعة = بلا خصم · إجازة بدون راتب = خصم يوم
     • استئذان معتمد (تأخير أو خروج مبكر) = معفى من الخصم
     • المصدر       = بصمات جهاز ZKTeco فقط (zkAttendance)
   ═══════════════════════════════════════════════════════════════════ */
function payrollConfig(){
  return {hoursPerDay:8,daysPerMonth:30,graceMinutes:0,...(SETTINGS.payroll||{})};
}
function isUnpaidLeave(leave){
  const lt=(SETTINGS.leaveTypes||[]).find(t=>t.id===(leave.leaveTypeId||leave.category));
  if(lt&&lt.unpaid!==undefined) return !!lt.unpaid;
  return /بدون\s*راتب/.test(leave.categoryLabel||'');
}
function computePayroll(cyc,users,requests,recs){
  const cfg=payrollConfig();
  const recMap={}; recs.forEach(r=>{recMap[r.employeeUid+'_'+r.date]=r;});
  const emps=users.filter(u=>u.role!=='admin');
  const now=new Date();
  const end=(cyc.end<now)?cyc.end:now;

  return emps.map(u=>{
    const salary=Number(u.salary)||0;
    const dayRate=cfg.daysPerMonth>0?salary/cfg.daysPerMonth:0;
    const hourRate=cfg.hoursPerDay>0?dayRate/cfg.hoursPerDay:0;
    let reqH=0,workH=0,lateMin=0,earlyMin=0,exemptMin=0;
    let absentDays=0,unpaidDays=0,paidLeaveDays=0,missingOut=0,presentDays=0,lateDays=0,workDays=0;
    const details=[];

    for(let d=new Date(cyc.start); d<=end; d.setDate(d.getDate()+1)){
      const dateStr=ymd(d), dow=d.getDay();
      const sh=resolveShift(dateStr,dow,u.department);
      if(!sh||sh.type==='off') continue;
      const need=shiftHours(sh);
      workDays++; reqH+=need;

      const leave=requests.find(r=>r.type==='leave'&&r.status==='approved'&&r.employeeUid===u.id&&r.startDate<=dateStr&&r.endDate>=dateStr);
      if(leave){
        if(isUnpaidLeave(leave)){
          unpaidDays++;
          details.push({dateStr,dow,status:'إجازة بدون راتب',lm:0,em:0,ded:dayRate,need});
        }else{
          paidLeaveDays++; workH+=need;
          details.push({dateStr,dow,status:'إجازة مدفوعة — '+(leave.categoryLabel||''),lm:0,em:0,ded:0,need});
        }
        continue;
      }

      const perms=requests.filter(r=>r.type==='permission'&&r.status==='approved'&&r.employeeUid===u.id&&r.date===dateStr);
      const latePerm =perms.find(p=>(p.category||'').includes('تأخير'));
      const earlyPerm=perms.find(p=>(p.category||'').includes('خروج'));

      const rec=recMap[u.id+'_'+dateStr];
      const ss=sessionsOf(rec);
      const firstIn=ss.length?tsToDate(ss[0].in):null;
      const lastOut=lastOutOf(ss);

      if(!firstIn){
        absentDays++;
        details.push({dateStr,dow,status:'غياب',lm:0,em:0,ded:dayRate,need});
        continue;
      }
      presentDays++;
      const win=shiftWindowFor(d,sh);
      let lm=0,em=0,ex=0,flag='';
      if(win){
        const rawLate=Math.max(0,Math.round((firstIn-win.start)/60000)-(cfg.graceMinutes||0));
        if(latePerm){ ex+=rawLate; }        /* استئذان معتمد → معفى */
        else        { lm=rawLate; }
        if(!lastOut){
          flag='نسيان بصمة الخروج'; missingOut++;
        }else{
          const rawEarly=Math.max(0,Math.round((win.end-lastOut)/60000));
          if(earlyPerm){ ex+=rawEarly; }
          else         { em=rawEarly; }
        }
      }
      if(lm>0) lateDays++;
      lateMin+=lm; earlyMin+=em; exemptMin+=ex;
      /* الساعات المحتسبة: الفعلية، وعند نسيان الانصراف نحسب المطلوب ناقص التأخير */
      workH += lastOut ? (workedSecs(ss).secs/3600) : Math.max(0,need-(lm/60));
      details.push({dateStr,dow,status:flag||(lm>0?'متأخر':'حاضر'),lm,em,ex,
                    ded:((lm+em)/60)*hourRate,need,in:firstIn,out:lastOut});
    }

    const dedHours =((lateMin+earlyMin)/60)*hourRate;
    const dedAbsent=absentDays*dayRate;
    const dedUnpaid=unpaidDays*dayRate;
    const total=dedHours+dedAbsent+dedUnpaid;
    return {u,salary,dayRate,hourRate,cfg,
            workDays,presentDays,lateDays,absentDays,unpaidDays,paidLeaveDays,missingOut,
            reqH,workH,lateMin,earlyMin,exemptMin,
            dedHours,dedAbsent,dedUnpaid,total,net:Math.max(0,salary-total),details};
  }).sort((a,b)=>(a.u.name||'').localeCompare(b.u.name||''));
}
const money=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const hhmm=m=>{m=Math.round(Math.max(0,m||0));return `${Math.floor(m/60)}س ${m%60}د`;};
