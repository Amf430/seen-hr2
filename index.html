<!-- ⚠️ frame-ancestors لا يعمل من <meta> إطلاقاً.
     مواصفة CSP تتجاهل frame-ancestors و report-uri و sandbox عند تسليمها في
     وسم meta — تعمل كترويسة HTTP فقط. الوسم القديم هنا كان يعطي إحساساً
     بالحماية بلا حماية: النظام كان قابلاً للتضمين في أي iframe، وواجهة الأدمن
     فيها «حذف نهائي» و«موافقة» و«تعليق حساب».

     GitHub Pages لا تسمح بترويسات مخصّصة، فالحل الجذري هو Firebase Hosting
     (انظر firebase.json في جذر المستودع — الترويسات جاهزة فيه). حتى ذلك الحين
     يقوم الكاسر أدناه بالمهمة.

     ما يبقى صالحاً في meta: بقية توجيهات CSP. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<script>
/* كاسر الإطار — قبل أي شيء آخر، وبلا انتظار تحميل الوحدات */
if (window.top !== window.self) {
  document.documentElement.innerHTML =
    '<body style="font-family:system-ui;padding:2rem;direction:rtl;text-align:center">' +
    '<h1>لا يمكن فتح هذا النظام داخل إطار</h1>' +
    '<p>افتحه من رابطه المباشر.</p></body>';
  try { window.top.location = window.self.location; } catch (e) { /* أصل مختلف */ }
}
</script>

<!-- ============ التحميل ============ -->
<div id="bootLoading" class="loading"><span class="spinner"></span> <span id="bootMsg">جارٍ التحميل…</span></div>

<!-- سكربت عادي (ليس module) عمداً: يعمل حتى لو مُنعت الوحدات من التحميل.
     بدونه تبقى شاشة «جارٍ التحميل…» معلّقة بلا أي تفسير — وهذا ما يحصل
     تماماً لو فُتح الملف بالنقر المزدوج من القرص. -->
<script>
(function () {
  window.__seenBoot = { done: false };

  function fail(title, detail) {
    var b = document.getElementById('bootLoading');
    if (!b || b.classList.contains('hidden')) return;
    b.className = 'boot-error';
    b.innerHTML = '<div class="boot-error__card"><h1>' + title + '</h1><div>' + detail + '</div></div>';
  }

  /* فتح الملف من القرص مباشرة — المتصفح يمنع تحميل الوحدات عبر file:// */
  if (location.protocol === 'file:') {
    fail('لا يمكن تشغيل النظام بفتح الملف مباشرة',
      'المتصفح يمنع تحميل ملفات الجافاسكربت عند فتح الصفحة من القرص (file://).' +
      '<br><br>افتح النظام من رابطه على الإنترنت، أو شغّل خادماً محلياً:' +
      '<br><code dir="ltr">python3 -m http.server 8000</code>' +
      '<br>ثم افتح <code dir="ltr">http://localhost:8000</code>');
    return;
  }

  /* لو ما اكتمل الإقلاع خلال 12 ثانية، أظهر سبباً مفهوماً بدل دوران بلا نهاية */
  setTimeout(function () {
    if (window.__seenBoot.done) return;
    fail('تعذّر إكمال التحميل',
      'ما وصلنا لخادم البيانات. تحقّق من اتصالك بالإنترنت ثم حدّث الصفحة.' +
      '<br><br>لو تكرّرت المشكلة، أبلغ الدعم الفني أن التحميل توقّف عند مرحلة: <b id="bootStage">التهيئة</b>');
  }, 12000);
})();
</script>

<!-- ============ الدخول ============ -->
<div id="loginScreen" class="hidden">
  <main class="login-card">
    <img class="brand-logo" src="img/logo.png" alt="سين العقارية" width="1814" height="1833">
    <h1>إدارة الموارد البشرية</h1>
    <div class="field">
      <label for="loginEmail">رقم الجوال</label>
      <input id="loginEmail" type="text" inputmode="numeric" placeholder="05xxxxxxxx" autocomplete="username" />
    </div>
    <div class="field">
      <label for="loginPass">كلمة المرور</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn">تسجيل الدخول</button>
    <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
    <button class="btn link" id="resetBtn">نسيت كلمة المرور؟</button>
    <div class="dev-credit">جميع الحقوق محفوظة — تطوير علاء فياض</div>
  </main>
</div>

<!-- ============ تغيير كلمة المرور لأول مرة ============ -->
<div id="pwScreen" class="hidden">
  <main class="login-card">
    <img class="brand-logo" src="img/logo.png" alt="سين العقارية" width="1814" height="1833">
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">لأول مرة، الرجاء تغيير كلمة المرور المبدئية قبل المتابعة</p>
    <div class="field">
      <label for="pwNew">كلمة المرور الجديدة</label>
      <input id="pwNew" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="pwConfirm">تأكيد كلمة المرور</label>
      <input id="pwConfirm" type="password" placeholder="أعد كتابتها" autocomplete="new-password" />
    </div>
    <button class="btn" id="pwSaveBtn">حفظ ومتابعة</button>
    <div class="err" id="pwErr" role="alert" aria-live="polite"></div>
  </main>
</div>

<!-- ============ التطبيق ============ -->
<div id="app" class="hidden">
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <img class="brand-mark brand-mark--img" src="img/mark-white-192.png" alt="" aria-hidden="true"
           width="192" height="192">
      <div><b>إدارة الموارد البشرية</b><span>سين العقارية</span></div>
    </div>
    <nav class="nav" id="navLinks" aria-label="التنقّل الرئيسي"></nav>
    <div class="foot">
      <div class="who" id="sideName">—</div>
      <div class="role" id="sideRole">—</div>
      <button id="logoutBtn">تسجيل الخروج</button>
      <div class="dev-credit dev-credit--dark">تطوير علاء فياض</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة"
              aria-controls="sidebar" aria-expanded="false">☰</button>
      <!-- زرّ الرجوع: يظهر في كل صفحة عدا الرئيسية. لا غنى عنه حين يُضاف
           النظام كأيقونة على الشاشة الرئيسية، فوضع standalone بلا زرّ رجوع
           من المتصفح أصلاً. السهم لليمين لأن الواجهة RTL. -->
      <button class="topbar__back" id="backBtn" aria-label="رجوع للصفحة السابقة" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 6l6 6-6 6"/><path d="M20 12H4"/></svg>
      </button>
      <div class="page-head">
        <h2 id="pageTitle">الرئيسية</h2>
        <div class="hint" id="pageHint"></div>
      </div>
      <button class="topbar__search" id="globalSearch" aria-label="بحث في النظام">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>بحث…</span><kbd>⌘K</kbd>
      </button>
      <!-- الجرس: عدّاده يُرسم من paintBell() مع كل لقطة بيانات جديدة -->
      <button class="topbar__bell" id="notifBell" aria-label="الإشعارات" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 9a6 6 0 1 0-12 0c0 4.5-1.5 5.8-2 6.5h16c-.5-.7-2-2-2-6.5Z"/>
          <path d="M10.5 19a1.8 1.8 0 0 0 3 0"/></svg>
      </button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
